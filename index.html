<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>Sistema Integrado de Apoio & Inspeção</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #0b4f2c;
            --primary-hover: #0e6538;
            --text-main: #f0f0f0;
            --text-muted: #a0a0a0;
            --accent: #2e7d32;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }

        h1 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #fff;
        }

        .status-bar {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metric-display {
            font-size: 2.2rem;
            font-weight: bold;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
        }

        /* ESTILOS DO MODO PLACA KM (TELA CHEIA / HORIZONTAL) */
        #km-sign-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0b4f2c; /* Verde sinalização rodoviária */
            border: 12px solid #ffffff;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            color: #ffffff;
            text-align: center;
            padding: 10px;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.5);
        }
        
        #km-sign-overlay.active {
            display: flex;
        }

        .sign-label {
            font-size: clamp(1rem, 3.5vw, 2rem);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 700;
            opacity: 0.9;
            border-bottom: 3px solid rgba(255, 255, 255, 0.4);
            padding-bottom: 8px;
            width: 60%;
            max-width: 300px;
        }

        .sign-value {
            font-size: clamp(6rem, 26vw, 18rem);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -4px;
            font-variant-numeric: tabular-nums;
            text-shadow: 4px 4px 0px rgba(0, 0, 0, 0.4);
        }

        .sign-unit {
            font-size: clamp(1.4rem, 4.5vw, 2.5rem);
            font-weight: 700;
            margin-top: 10px;
            letter-spacing: 3px;
        }

        .sign-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #fff;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: bold;
        }

        @media (orientation: landscape) {
            #km-sign-overlay.auto-rotate {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Painel Operacional</h1>
        <div class="status-bar" id="systemStatus">Sistema pronto • Armazenamento Local Ativo</div>
    </header>

    <!-- Cartão Principal de Métricas -->
    <div class="card">
        <div class="card-title">KM Atual em Tempo Real</div>
        <div class="metric-display" id="mainKmDisplay">000.0</div>
        <button onclick="openKmSignMode()" class="btn">
            🛣️ Abrir Modo Placa KM (Tela Cheia / Horizontal)
        </button>
    </div>

    <!-- Seção de Ações e Logs Manuais -->
    <div class="card">
        <div class="card-title">Ações Rápidas</div>
        <button onclick="simularAvancoKm()" class="btn btn-secondary">Simular Avanço de KM (+1.5)</button>
    </div>

    <!-- OVERLAY DA PLACA DE KM (TELA CHEIA) -->
    <div id="km-sign-overlay">
        <button class="sign-close-btn" onclick="closeKmSignMode()">✕ Sair</button>
        <div class="sign-label">KM ATUAL</div>
        <div class="sign-value" id="signKmDisplay">000.0</div>
        <div class="sign-unit">KM</div>
    </div>

    <script>
        // Variável global de KM do aplicativo
        window.currentAppKm = "045.2";
        let kmSignActive = false;
        let signWatchId = null;

        // Atualiza a interface inicial
        function updateDisplays() {
            document.getElementById('mainKmDisplay').textContent = window.currentAppKm;
            if (kmSignActive) {
                document.getElementById('signKmDisplay').textContent = window.currentAppKm;
            }
        }
        updateDisplays();

        // Função de simulação para testes rápidos em campo
        function simularAvancoKm() {
            let atual = parseFloat(window.currentAppKm);
            atual += 1.5;
            window.currentAppKm = atual.toFixed(1).padStart(5, '0');
            updateDisplays();
        }

        // Abre o modo placa rodoviária em tela cheia
        function openKmSignMode() {
            kmSignActive = true;
            const overlay = document.getElementById('km-sign-overlay');
            overlay.classList.add('active');
            
            // Sincroniza valor atual imediatamente
            document.getElementById('signKmDisplay').textContent = window.currentAppKm;

            // Solicita modo tela cheia para imersão total
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            // Tenta forçar orientação horizontal (landscape) se suportado pelo navegador móvel
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }

            // Inicia monitoramento contínuo por Geolocalização (caso queira rastreamento GPS real)
            if (navigator.geolocation) {
                signWatchId = navigator.geolocation.watchPosition(
                    (position) => {
                        // Se houver cálculo de KM por GPS ativo, atualiza aqui. 
                        // Mantemos integrado com window.currentAppKm como fallback.
                        if(position.coords && position.coords.speed !== null) {
                            // Exemplo opcional de atualização baseada em coordenadas se necessário
                        }
                    },
                    (error) => { console.warn("Aviso GPS:", error.message); },
                    { enableHighAccuracy: true, maximumAge: 500, timeout: 5000 }
                );
            }
        }

        // Fecha o modo placa rodoviária
        function closeKmSignMode() {
            kmSignActive = false;
            document.getElementById('km-sign-overlay').classList.remove('active');
            
            if (document.exitFullscreen && document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
            if (signWatchId !== null) {
                navigator.geolocation.clearWatch(signWatchId);
                signWatchId = null;
            }
        }

        // Detecção opcional de mudança de orientação do celular
        window.addEventListener("orientationchange", () => {
            const isLandscape = window.matchMedia("(orientation: landscape)").matches;
            // Descomente a linha abaixo se desejar ativar a placa automaticamente ao virar o celular:
            // if (isLandscape) { openKmSignMode(); } else { closeKmSignMode(); }
        });
    </script>
</body>
</html>
