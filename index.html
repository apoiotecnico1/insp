<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>km / gps - tempo real</title>
<meta name="theme-color" content="#000000" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #000000;
    --card: #111111;
    --border: #333333;
    --yellow: #ffd600;
    --green: #00e676;
    --text: #ffffff;
    --bad: #ff1744;
    --warn: #ff9100;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.2;
    padding: 10px;
    text-transform: lowercase;
  }

  .km-box {
    background: #00875a;
    border: 3px solid #ffffff;
    border-radius: 8px;
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin-bottom: 10px;
  }

  .km-label { font-size: 1rem; font-weight: 900; color: #ffffff; }
  .km-value { font-size: 2.5rem; font-weight: 900; color: #ffffff; line-height: 1; }

  .status-box {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.85rem;
    font-weight: 800;
    text-align: center;
    margin-bottom: 10px;
  }

  .ok { color: var(--green); border-color: var(--green); }
  .warn { color: var(--warn); border-color: var(--warn); }
  .bad { color: var(--bad); border-color: var(--bad); }

  .card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
  }

  button#btnSend {
    width: 100%;
    min-height: 40px;
    padding: 8px 12px;
    font-family: var(--font);
    font-size: 0.95rem;
    font-weight: 900;
    border: 0;
    border-radius: 6px;
    background: var(--green);
    color: #000000;
    cursor: pointer;
    text-transform: lowercase;
  }

  button#btnSend:disabled { background: #222222; color: #555555; }

  .controls { display: flex; gap: 12px; margin-top: 8px; align-items: center; }
  .controls label { display: flex; align-items: center; gap: 4px; font-size: 0.85rem; font-weight: 800; }

  select {
    padding: 4px 8px;
    font-family: var(--font);
    font-size: 0.9rem;
    font-weight: 900;
    border-radius: 4px;
    border: 1px solid #444444;
    background: #222222;
    color: #ffffff;
  }

  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  li {
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    background: #181818;
    font-weight: 800;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  li.nearest { background: #222000; border: 3px solid var(--yellow); }

  .item-header { display: flex; justify-content: space-between; align-items: center; }
  .id-val { font-size: 1rem; font-weight: 800; color: #ffffff; }
  .dist-val { color: var(--yellow); font-size: 0.95rem; font-weight: 800; }

  .mini-map-container {
    width: 100%;
    height: 140px;
    border-radius: 4px;
    border: 1px solid #444444;
    background: #000;
  }
</style>
</head>
<body>

<div class="km-box">
  <span class="km-label">km</span>
  <span id="kmValue" class="km-value">—</span>
</div>

<div id="gpsStatus" class="status-box bad">gps: aguardando...</div>

<div class="card">
  <button id="btnSend" disabled>whatsapp</button>
  <div class="controls">
    <label>
      qtd:
      <select id="qty">
        <option value="1">1</option>
        <option value="5">5</option>
        <option value="10" selected>10</option>
      </select>
    </label>
  </div>
</div>

<div class="card">
  <ul id="list"></ul>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let dataset = [], kmDataset = [], lastPos = null;
const mapInstances = {};

const gpsStatus = document.getElementById('gpsStatus');
const btnSend = document.getElementById('btnSend');
const qtySel = document.getElementById('qty');
const listEl = document.getElementById('list');
const kmValue = document.getElementById('kmValue');

function hav(a,b,c,d){
  const p=0.017453292519943295, cos=Math.cos;
  const x = 0.5 - cos((c - a) * p)/2 + cos(a * p) * cos(c * p) * (1 - cos((d - b) * p))/2;
  return 12742000 * Math.asin(Math.sqrt(x));
}

function nearestN(lat,lon,n=10){
  if(!dataset.length) return [];
  const arr = dataset.map(p => ({id:p.id, lat:p.lat, lon:p.lon, d:hav(lat,lon,p.lat,p.lon)}));
  arr.sort((a,b)=>a.d-b.d);
  return arr.slice(0, n);
}

function render(){
  if(!lastPos || !dataset.length) return;
  const qty = Number(qtySel.value || 10);
  const items = nearestN(lastPos.lat, lastPos.lon, qty);

  listEl.innerHTML = '';
  
  items.forEach((o, idx) => {
    const li = document.createElement('li');
    if(idx === 0) li.classList.add('nearest');

    const mapId = `map-${o.id}`;
    li.innerHTML = `
      <div class="item-header">
        <span class="id-val">${o.id}</span>
        <span class="dist-val">distância: ${Math.round(o.d)}m</span>
      </div>
      <div id="${mapId}" class="mini-map-container"></div>
    `;
    listEl.appendChild(li);

    // Inicializa o mapa com atualização dinâmica do ponto
    setTimeout(() => {
      const map = L.map(mapId, { zoomControl: false, attributionControl: false }).setView([o.lat, o.lon], 18);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      
      // Marcador fixo do ponto cadastrado
      L.circleMarker([o.lat, o.lon], { color: 'red', radius: 6 }).addTo(map);

      // Marcador dinâmico do usuário (atualizado via GPS)
      L.circleMarker([lastPos.lat, lastPos.lon], { color: '#ffd600', radius: 8 }).addTo(map);
    }, 50);
  });

  btnSend.disabled = false;
}

function startGPS(){
  if(!('geolocation' in navigator)) return;
  navigator.geolocation.watchPosition(p => {
    lastPos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
    gpsStatus.className = 'status-box ok';
    gpsStatus.textContent = `gps ok (±${Math.round(p.coords.accuracy)}m)`;
    render();
  }, null, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
}

startGPS();
</script>
</body>
</html>
