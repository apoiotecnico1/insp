<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>ID GPS · IDs Próximos</title>
<meta name="theme-color" content="#08101d" />
<style>
  :root{
    --brand:#f26522;
    --brand2:#ff8243;
    --bg:#08101d;
    --bg-2:#0f1d32;
    --surface:#152642;
    --surface-2:#1b3052;
    --fg:#f0f4f8;
    --muted:#8fa0b5;
    --border:#243d63;
    --ok:#10b981;
    --warn:#f59e0b;
    --bad:#ef4444;
    --btn:#f26522;
    --focus:#ffaa7a;
    --pill:#1e1b18;
    --km-bg:#ffffff;
    --km-fg:#0f1d32;
    --km-border:#0f2744;
    --km-band:#0f2744;
    --info-bg:#12213a;
    --info-border:#294975;
    --info-fg:#e2ebf5;
    --info-icon:#ffaa7a;
    --shadow:0 12px 28px rgba(3,8,16,.65);
    --radius:10px;
    --font-tech:"JetBrains Mono","Fira Code","Cascadia Code","Consolas","Courier New",monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-tech);line-height:1.3;-webkit-font-smoothing:antialiased}
  header{background:linear-gradient(90deg,var(--brand),var(--brand2));padding:12px 16px;box-shadow:var(--shadow)}
  .brand{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .dot-logo{width:10px;height:10px;border-radius:50%;background:#fff;opacity:.95}
  .brand h1{margin:0;font-weight:900;letter-spacing:.08em;color:#ffffff;font-size:clamp(0.95rem,1.8vw,1.1rem);text-transform:uppercase}

  #status{max-width:1100px;margin:12px auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 16px}
  .chip,.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:8px 10px;border-radius:6px;font-weight:700;font-size:0.85rem;box-shadow:var(--shadow)}
  .dot{width:8px;height:8px;border-radius:50%}
  .ok .dot{background:var(--ok)}.ok{color:#a7f3d0}
  .warn .dot{background:var(--warn)}.warn{color:#fde68a}
  .bad .dot{background:var(--bad)}.bad{color:#fca5a5}
  .badge{color:#e2ebf5}

  main{max-width:1100px;margin:12px auto 24px;display:grid;gap:14px;padding:0 16px}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .card h2{margin:0 0 10px 0;font-size:clamp(0.9rem,1.5vw,1rem);color:var(--fg);text-transform:uppercase;letter-spacing:.04em}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{padding:12px 16px;font-family:var(--font-tech);font-size:clamp(.85rem,1.4vw,.95rem);font-weight:800;border:0;border-radius:8px;color:#ffffff;cursor:pointer;transition:transform .08s ease, filter .15s ease;box-shadow:0 4px 14px rgba(0,0,0,.4);text-transform:uppercase;letter-spacing:.03em}
  button:active{transform:translateY(1px)}button:hover{filter:brightness(1.08)}button:disabled{opacity:.55;cursor:not-allowed;filter:none}
  #btnSend{background:var(--btn)}
  .opt{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem}
  .opt input[type="checkbox"]{width:16px;height:16px;accent-color:var(--brand)}
  .opt select{padding:8px 10px;font-family:var(--font-tech);border-radius:6px;border:1px solid var(--border);background:var(--bg-2);color:var(--fg);font-weight:700;cursor:pointer}

  ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
  li{line-height:1.2;font-family:var(--font-tech);border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--surface-2);font-size:0.95rem;color:var(--fg);display:flex;justify-content:space-between;gap:10px;align-items:center;will-change:transform}
  li.nearest{border-color:var(--brand);box-shadow:0 0 0 2px rgba(242,101,34,.3) inset;background:linear-gradient(0deg, rgba(242,101,34,.12), rgba(242,101,34,.02))}
  li.nearest .id-badge{display:inline-flex;align-items:center;gap:6px;background:var(--pill);padding:2px 8px;border-radius:4px;outline:1px solid rgba(242,101,34,.5)}
  li.nearest .id-badge .id-label{font-weight:900;letter-spacing:.02em;color:#ffcca8;font-size:1rem}
  li.nearest .id-badge .flag{padding:2px 6px;border-radius:4px;background:var(--brand);color:#ffffff;font-weight:900;font-size:.65rem;text-transform:uppercase}
  .id-label{font-weight:700}
  .dist{color:var(--muted);opacity:.9;font-size:.8rem;min-width:60px;text-align:right}
  .skeleton{height:42px;border-radius:8px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 40%,var(--surface-2) 60%);background-size:200% 100%;animation:shimmer 1.1s infinite}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .col-4{grid-column:span 4}.col-8{grid-column:span 8}
  @media (max-width:900px){.col-4,.col-8{grid-column:1/-1}}
  button:focus-visible, select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  /* KM placa */
  .km-sign{margin-left:auto;display:inline-flex;align-items:stretch;gap:0;background:var(--km-bg);color:var(--km-fg);border:3px solid var(--km-border);border-radius:6px;box-shadow:0 8px 18px rgba(0,0,0,.35);overflow:hidden}
  .km-band{background:var(--km-band);color:#ffffff;width:auto;min-width:14px;padding:4px 8px;display:flex;align-items:center;justify-content:center}
  .km-body{padding:4px 10px 6px;display:flex;align-items:center;gap:8px;background:var(--km-bg)}
  .km-body-col{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .km-row{display:flex;align-items:baseline;gap:8px}
  .km-label{font-weight:900;letter-spacing:.06em;font-size:clamp(.85rem,1.4vw,1rem);opacity:.9}
  .km-value{font-weight:900;letter-spacing:.02em;font-size:clamp(1.4rem,3vw,2rem);line-height:1;color:var(--km-fg);min-width:4ch;text-align:right}
  .km-subnote{font-size:.58rem;line-height:1.1;color:#334e68;opacity:.85;text-align:right;max-width:22ch;white-space:normal}
  @media (max-width:480px){.km-body{padding:4px 8px 6px}.km-value{font-size:clamp(1.3rem,5vw,1.8rem)}}

  /* Banner informativo */
  .container{max-width:1100px;margin:0 auto;padding:0 16px}
  .info-trigger-wrap{max-width:1100px;margin:10px auto 0;padding:0 16px;display:flex;align-items:center}
  .info-trigger{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:rgba(242,101,34,.15);color:var(--info-icon);border:1px solid rgba(242,101,34,.35);cursor:pointer}
  .info-panel{max-width:1100px;margin:8px auto 0;border:1px solid var(--info-border);border-radius:8px;color:var(--info-fg);display:none;background:var(--info-bg)}
  .info-panel.open{display:block}
  .info-panel-inner{padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:flex-start}
  .info-hero{display:flex;align-items:center;gap:8px}
  .info-hero .icon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:rgba(242,101,34,.2);color:var(--info-icon);font-size:.9rem}
  .info-title{margin:0;font-weight:900;letter-spacing:.02em;color:var(--fg);font-size:clamp(.85rem,1.2vw,1rem);text-transform:uppercase}
  .info-text{margin:4px 0 0 0;font-size:.8rem;line-height:1.35;opacity:.9}
  .info-text .strong{font-weight:800;color:var(--fg)}
  .info-close{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--info-fg);font-weight:900;cursor:pointer}
  @media (max-width:600px){.info-panel-inner{grid-template-columns:1fr;gap:10px}.info-close{justify-self:end}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot-logo" aria-hidden="true"></span>
    <h1>ID GPS · MOTIVA</h1>
    <div id="kmChip" class="km-sign" aria-live="polite">
      <div class="km-band" aria-hidden="true"></div>
      <div class="km-body">
        <div class="km-row">
          <span class="km-label">KM</span>
          <span id="kmValue" class="km-value">—</span>
        </div>
        <div class="km-body-col" style="margin-left:auto">
          <span class="km-subnote">MARCO QUILOMÉTRICO EM LINHA RETA MAIS PRÓXIMO DA RODOVIA.</span>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="info-trigger-wrap">
  <button id="infoOpen" class="info-trigger" title="INFO"><span aria-hidden="true">ℹ</span></button>
</div>

<div id="infoPanel" class="info-panel" role="dialog" aria-modal="false" aria-label="Informações">
  <div class="info-panel-inner container">
    <div class="info-hero">
      <span class="icon" aria-hidden="true">ℹ</span>
      <h2 class="info-title">SISTEMA AUXILIAR</h2>
    </div>
    <div class="info-text">
      <span class="strong">ATENÇÃO:</span> BASE DE DADOS ESTÁTICA PARA SUPORTE OPERACIONAL DE CAMPO. UTILIZE COMO APOIO À LOCALIZAÇÃO E INSPEÇÃO.
    </div>
    <button id="infoClose" class="info-close" aria-label="Fechar">✕</button>
  </div>
</div>

<div id="status" role="region" aria-label="Status do sistema">
  <div id="gpsChip" class="chip bad" aria-live="polite">
    <span class="dot"></span><span id="gpsText">GPS: BUSCANDO...</span>
  </div>
  <div id="diag" class="badge" style="display:none" aria-live="polite">—</div>
</div>

<main>
  <div class="grid">
    <section class="card col-4" aria-label="Ações">
      <h2>TRANSMISSÃO DE DADOS</h2>
      <div class="actions" style="margin-bottom:8px"><button id="btnSend" disabled>ENVIAR VIA WHATSAPP</button></div>
      <div class="actions" style="gap:12px">
        <label class="opt" title="QTD ID"><span style="opacity:.9">REGISTROS</span>
          <select id="qty"><option value="1">1</option><option value="5">5</option><option value="10" selected>10</option><option value="20">20</option><option value="50">50</option></select>
        </label>
        <label class="opt"><input type="checkbox" id="chkMaps" /><span>LINKS MAPS</span></label>
      </div>
    </section>

    <section class="card col-8" aria-label="IDs mais próximos">
      <h2>MATRIZ DE REGISTROS PRÓXIMOS</h2>
      <ul id="list" aria-live="polite">
        <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
      </ul>
    </section>
  </div>
</main>

<script>
const ACC_GREEN=15, ACC_YELLOW=35;
let dataset=[], kmDataset=[], lastPos=null, isRendering=false;

// --- FILTRO DE KALMAN SIMPLIFICADO PARA PRECISÃO DO GPS ---
class KalmanFilter {
  constructor(R = 0.00001, Q = 0.000001) {
    this.R = R; this.Q = Q; this.x = NaN; this.cov = NaN;
  }
  filter(z, u = 0) {
    if (isNaN(this.x)) { this.x = z; this.cov = 1; return z; }
    const predCov = this.cov + this.Q;
    const K = predCov / (predCov + this.R);
    this.x = this.x + K * (z - this.x);
    this.cov = predCov * (1 - K);
    return this.x;
  }
}
const kLat = new KalmanFilter(), kLon = new KalmanFilter();

const gpsChip=document.getElementById('gpsChip'), gpsText=document.getElementById('gpsText'), diag=document.getElementById('diag');
const btnSend=document.getElementById('btnSend'), chkMaps=document.getElementById('chkMaps'), qtySel=document.getElementById('qty');
const listEl=document.getElementById('list'), kmValue=document.getElementById('kmValue');

const infoOpen=document.getElementById('infoOpen'), infoClose=document.getElementById('infoClose'), infoPanel=document.getElementById('infoPanel');
infoOpen.addEventListener('click', ()=>infoPanel.classList.add('open'));
infoClose.addEventListener('click', ()=>infoPanel.classList.remove('open'));

function showDiag(msg){ diag.style.display='inline-flex'; diag.textContent=msg; }
function normalizeStr(s){ return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9_ ]+/g,' ').replace(/\s+/g,' '); }
function findColumnIndex(headers, candidates){ const map=headers.map(h=>normalizeStr(h)); for(const c of candidates){ const i=map.indexOf(c); if(i>=0) return i; } return -1; }
function parsePt(v){ if(v==null) return NaN; const s=String(v).trim(); return /,\d{1,}$/.test(s)? Number(s.replace(/\./g,'').replace(',','.')): Number(s); }

// HAVERSINE OTIMIZADO
function hav(a,b,c,d){
  const p=0.017453292519943295, cos=Math.cos;
  const x = 0.5 - cos((c - a) * p)/2 + cos(a * p) * cos(c * p) * (1 - cos((d - b) * p))/2;
  return 12742000 * Math.asin(Math.sqrt(x));
}

// BUSCA OTIMIZADA COM BOUNDING BOX (O(log N + M))
function nearestN(lat,lon,n=10){
  if(!dataset.length) return [];
  const margin = 0.05; // Bounding box ~5km
  const filtered = dataset.filter(p => Math.abs(p.lat - lat) < margin && Math.abs(p.lon - lon) < margin);
  const targetArray = filtered.length >= n ? filtered : dataset;
  
  const arr = targetArray.map(p => ({id:p.id, lat:p.lat, lon:p.lon, d:hav(lat,lon,p.lat,p.lon)}));
  arr.sort((a,b)=>a.d-b.d);
  return arr.slice(0, n);
}

function fmtAcc(a){ return (a==null||!Number.isFinite(a))?'—':('±'+Math.round(a)+'M'); }
function nowBR(){ return new Date().toLocaleString('pt-BR'); }

function updateGpsChip(){
  if(!lastPos || lastPos.acc==null){ gpsChip.className='chip bad'; gpsText.textContent='GPS: BUSCANDO...'; return; }
  const a=Math.round(lastPos.acc);
  if(a<=ACC_GREEN){ gpsChip.className='chip ok'; gpsText.textContent=`GPS: OK (${fmtAcc(a)})`; }
  else if(a<=ACC_YELLOW){ gpsChip.className='chip warn'; gpsText.textContent=`GPS: AJUSTANDO (${fmtAcc(a)})`; }
  else { gpsChip.className='chip bad'; gpsText.textContent=`GPS: FRACO (${fmtAcc(a)})`; }
}

async function loadCSV(){
  try{
    let resp = await fetch('dados.csv?v='+Date.now(), {cache:'no-store'}).catch(()=>null);
    if(!resp || !resp.ok) resp = await fetch('Dados_Completos_Grupo_2_all.csv?v='+Date.now(), {cache:'no-store'});
    if(!resp.ok){ showDiag('❌ CSV INDISPONÍVEL'); return; }
    
    let text = await resp.text(); if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
    const lines = text.split(/\r?\n/).filter(l=>l.trim()!=='');
    const head = lines.shift().split(';');
    const iId=findColumnIndex(head,['id do nox','idnox','id']), iLat=findColumnIndex(head,['latitude','lat']), iLon=findColumnIndex(head,['longitude','lon','long']);
    
    dataset = lines.map(l=>{ const r=l.split(';'); return {id:String(r[iId]||'').trim(), lat:parsePt(r[iLat]), lon:parsePt(r[iLon])}; })
                   .filter(p=>p.id && Number.isFinite(p.lat)&&Number.isFinite(p.lon));
                   
    dataset.sort((a,b) => a.lat - b.lat); // Ordena para otimização
    render();
  }catch(e){ showDiag('❌ ERRO CSV'); }
}

function render(){
  if(isRendering) return;
  isRendering = true;
  requestAnimationFrame(()=>{
    listEl.innerHTML='';
    if(lastPos && dataset.length){
      const qty = Number(qtySel.value || 10);
      const items = nearestN(lastPos.lat, lastPos.lon, qty);
      const frag = document.createDocumentFragment();
      
      items.forEach((o,idx)=>{
        const li = document.createElement('li');
        if(idx===0){
          li.classList.add('nearest');
          li.innerHTML = `<span><span class="id-badge"><span class="id-label">${o.id}</span><span class="flag">PRÓXIMO</span></span></span><span class="dist">${Math.round(o.d)} M</span>`;
        } else {
          li.innerHTML = `<span class="id-label">${o.id}</span><span class="dist">${Math.round(o.d)} M</span>`;
        }
        frag.appendChild(li);
      });
      listEl.appendChild(frag);
    }
    btnSend.disabled = !(dataset.length > 0 && lastPos);
    isRendering = false;
  });
}

function startGPS(){
  if(!('geolocation' in navigator)){ showDiag('❌ SEM GPS'); return; }
  navigator.geolocation.watchPosition(p=>{
    // Aplicação do Filtro de Kalman
    const filteredLat = kLat.filter(p.coords.latitude);
    const filteredLon = kLon.filter(p.coords.longitude);
    
    lastPos = { lat: filteredLat, lon: filteredLon, acc: p.coords.accuracy };
    updateGpsChip();
    render();
    updateKMChip();
  }, err=>{ showDiag('❗ ATIVE O GPS'); }, {enableHighAccuracy:true, maximumAge:0, timeout:10000});
}

btnSend.addEventListener('click', ()=>{
  if(!lastPos) return;
  const items = nearestN(lastPos.lat, lastPos.lon, Number(qtySel.value || 10));
  let tx = `[TELEMETRIA MOTIVA] ${nowBR()}\nGPS: ${lastPos.lat.toFixed(6)},${lastPos.lon.toFixed(6)} (${fmtAcc(lastPos.acc)})\n\n`;
  items.forEach(o => tx += `ID: ${o.id}\n`);
  if(chkMaps.checked){
    tx += '\nMAPAS:\n';
    items.forEach(o => tx += `ID ${o.id}: https://maps.google.com/?q=${o.lat.toFixed(6)},${o.lon.toFixed(6)}\n`);
  }
  window.open('https://wa.me/?text='+encodeURIComponent(tx),'_blank');
});

qtySel.addEventListener('change', render);

async function loadKMCSV(){
  try{
    let resp = await fetch('SNVBR116SPRJ.csv?v=' + Date.now(), {cache:'no-store'});
    if(!resp.ok) return;
    let text = await resp.text(); if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
    const head = lines.shift().split(';');
    const iKm = findColumnIndex(head, ['km']), iLat = findColumnIndex(head, ['lat','latitude']), iLon = findColumnIndex(head, ['lon','long','longitude']);
    kmDataset = lines.map(l=>{ const r = l.split(';'); return { km:parsePt(r[iKm]), lat:parsePt(r[iLat]), lon:parsePt(r[iLon]) }; })
                     .filter(p => Number.isFinite(p.km) && Number.isFinite(p.lat) && Number.isFinite(p.lon));
  }catch(e){}
}

function updateKMChip(){
  if(!lastPos || !kmDataset.length) return;
  let best = null, bd = Infinity;
  for(let i=0; i<kmDataset.length; i++){
    const p = kmDataset[i];
    const d = hav(lastPos.lat, lastPos.lon, p.lat, p.lon);
    if(d < bd){ bd = d; best = p; }
  }
  if(best) kmValue.textContent = (Math.round(best.km * 100) / 100).toFixed(2).replace('.', ',');
}

(function boot(){
  loadCSV();
  loadKMCSV();
  startGPS();
})();
</script>
</body>
</html>
