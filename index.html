<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>km / gps</title>
<meta name="theme-color" content="#000000" />
<style>
  :root {
    --bg: #000000;
    --card: #111111;
    --border: #333333;
    --yellow: #ffd600;
    --green: #00e676;
    --text: #ffffff;
    --muted: #888888;
    --bad: #ff1744;
    --warn: #ff9100;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.2;
    padding: 10px;
    text-transform: lowercase;
  }

  .km-box {
    background: #00875a;
    border: 3px solid #ffffff;
    border-radius: 8px;
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin-bottom: 10px;
  }

  .km-label {
    font-size: 1rem;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 0.05em;
  }

  .km-value {
    font-size: 2.5rem;
    font-weight: 900;
    color: #ffffff;
    line-height: 1;
  }

  .status-box {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.85rem;
    font-weight: 800;
    text-align: center;
    margin-bottom: 10px;
  }

  .ok { color: var(--green); border-color: var(--green); }
  .warn { color: var(--warn); border-color: var(--warn); }
  .bad { color: var(--bad); border-color: var(--bad); }

  .card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
  }

  button#btnSend {
    width: 100%;
    min-height: 40px;
    padding: 8px 12px;
    font-family: var(--font);
    font-size: 0.95rem;
    font-weight: 900;
    border: 0;
    border-radius: 6px;
    background: var(--green);
    color: #000000;
    cursor: pointer;
    text-transform: lowercase;
  }

  button#btnSend:disabled {
    background: #222222;
    color: #555555;
  }

  .controls {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    align-items: center;
  }

  .controls label {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.85rem;
    font-weight: 800;
  }

  select {
    padding: 4px 8px;
    font-family: var(--font);
    font-size: 0.9rem;
    font-weight: 900;
    border-radius: 4px;
    border: 1px solid #444444;
    background: #222222;
    color: #ffffff;
  }

  input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--yellow);
  }

  ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 10px;
  }

  li {
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    background: #181818;
    font-weight: 800;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  li.nearest {
    background: #222000;
    border: 3px solid var(--yellow);
    color: #ffffff;
  }

  .item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 1rem;
  }

  li.nearest .id-val, li.nearest .dist-val {
    color: var(--yellow);
    font-size: 1.05rem;
    font-weight: 900;
  }

  .id-val { font-size: 1rem; font-weight: 800; color: #ffffff; }
  .dist-val { color: var(--yellow); font-size: 0.95rem; font-weight: 800; }

  .mini-map {
    width: 100%;
    height: 130px;
    border-radius: 4px;
    border: 1px solid #444444;
    overflow: hidden;
    position: relative;
    background: #000000;
  }

  .mini-map iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }

  .skeleton { height: 42px; background: #222222; border-radius: 6px; }
</style>
</head>
<body>

<div class="km-box">
  <span class="km-label">km</span>
  <span id="kmValue" class="km-value">—</span>
</div>

<div id="gpsStatus" class="status-box bad">
  gps: aguardando...
</div>

<div class="card">
  <button id="btnSend" disabled>whatsapp</button>
  <div class="controls">
    <label>
      qtd:
      <select id="qty">
        <option value="1">1</option>
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="20">20</option>
      </select>
    </label>
    <label>
      <input type="checkbox" id="chkMaps" />
      maps
    </label>
  </div>
</div>

<div class="card">
  <ul id="list">
    <li class="skeleton"></li>
    <li class="skeleton"></li>
  </ul>
</div>

<script>
const ACC_GREEN = 15, ACC_YELLOW = 35;
let dataset = [], kmDataset = [], lastPos = null;
let currentRenderedKey = "";

const gpsStatus = document.getElementById('gpsStatus');
const btnSend = document.getElementById('btnSend');
const chkMaps = document.getElementById('chkMaps');
const qtySel = document.getElementById('qty');
const listEl = document.getElementById('list');
const kmValue = document.getElementById('kmValue');

function normalizeStr(s){ return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9_ ]+/g,' ').replace(/\s+/g,' '); }
function findColumnIndex(headers, candidates){ const map=headers.map(h=>normalizeStr(h)); for(const c of candidates){ const i=map.indexOf(c); if(i>=0) return i; } return -1; }
function parsePt(v){ if(v==null) return NaN; const s=String(v).trim(); return /,\d{1,}$/.test(s)? Number(s.replace(/\./g,'').replace(',','.')): Number(s); }

function hav(a,b,c,d){
  const p=0.017453292519943295, cos=Math.cos;
  const x = 0.5 - cos((c - a) * p)/2 + cos(a * p) * cos(c * p) * (1 - cos((d - b) * p))/2;
  return 12742000 * Math.asin(Math.sqrt(x));
}

function nearestN(lat,lon,n=10){
  if(!dataset.length) return [];
  const arr = dataset.map(p => ({id:p.id, lat:p.lat, lon:p.lon, d:hav(lat,lon,p.lat,p.lon)}));
  arr.sort((a,b)=>a.d-b.d);
  return arr.slice(0, n);
}

function fmtAcc(a){ return (a==null||!Number.isFinite(a))?'—':('±'+Math.round(a)+'m'); }
function nowBR(){ return new Date().toLocaleString('pt-BR').toLowerCase(); }

function getRangeText(dist, acc) {
  const err = (acc != null && Number.isFinite(acc)) ? Math.round(acc) : 0;
  const d = Math.round(dist);
  const min = Math.max(0, d - err);
  const max = d + err;
  return `${min}m a ${max}m`;
}

function updateGpsStatus(){
  if(!lastPos || lastPos.acc==null){ 
    gpsStatus.className='status-box bad'; 
    gpsStatus.textContent='gps: buscando...'; 
    return; 
  }
  const a=Math.round(lastPos.acc);
  if(a<=ACC_GREEN){ 
    gpsStatus.className='status-box ok'; 
    gpsStatus.textContent=`gps ok (${fmtAcc(a)})`; 
  } else if(a<=ACC_YELLOW){ 
    gpsStatus.className='status-box warn'; 
    gpsStatus.textContent=`gps medio (${fmtAcc(a)})`; 
  } else { 
    gpsStatus.className='status-box bad'; 
    gpsStatus.textContent=`gps fraco (${fmtAcc(a)})`; 
  }
}

function render(){
  if(!lastPos || !dataset.length) return;

  const qty = Number(qtySel.value || 10);
  const items = nearestN(lastPos.lat, lastPos.lon, qty);
  const itemKey = items.map(i => i.id).join(',');

  // Se a lista de pontos próximos for a mesma, atualiza apenas a distância sem recarregar os mini mapas
  if(itemKey === currentRenderedKey){
    items.forEach((o, idx) => {
      const el = document.getElementById(`dist-val-${idx}`);
      if(el) el.textContent = `distância: ${getRangeText(o.d, lastPos.acc)}`;
    });
    btnSend.disabled = false;
    return;
  }

  currentRenderedKey = itemKey;
  listEl.innerHTML = '';
  const frag = document.createDocumentFragment();

  items.forEach((o, idx) => {
    const li = document.createElement('li');
    if(idx === 0) li.classList.add('nearest');

    li.innerHTML = `
      <div class="item-header">
        <span class="id-val">${o.id}</span>
        <span class="dist-val" id="dist-val-${idx}">distância: ${getRangeText(o.d, lastPos.acc)}</span>
      </div>
      <div class="mini-map">
        <iframe 
          src="https://maps.google.com/maps?q=${o.lat},${o.lon}&t=k&z=19&ie=UTF8&iwloc=&output=embed" 
          loading="lazy">
        </iframe>
      </div>
    `;
    frag.appendChild(li);
  });

  listEl.appendChild(frag);
  btnSend.disabled = false;
}

async function loadCSV(){
  try{
    let resp = await fetch('dados.csv?v='+Date.now(), {cache:'no-store'}).catch(()=>null);
    if(!resp || !resp.ok) resp = await fetch('Dados_Completos_Grupo_2_all.csv?v='+Date.now(), {cache:'no-store'});
    if(!resp.ok) return;
    
    let text = await resp.text(); if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
    const lines = text.split(/\r?\n/).filter(l=>l.trim()!=='');
    const head = lines.shift().split(';');
    const iId=findColumnIndex(head,['id do nox','idnox','id']), iLat=findColumnIndex(head,['latitude','lat']), iLon=findColumnIndex(head,['longitude','lon','long']);
    
    dataset = lines.map(l=>{ const r=l.split(';'); return {id:String(r[iId]||'').trim(), lat:parsePt(r[iLat]), lon:parsePt(r[iLon])}; })
                   .filter(p=>p.id && Number.isFinite(p.lat)&&Number.isFinite(p.lon));
    render();
  }catch(e){}
}

async function loadKMCSV(){
  try{
    let resp = await fetch('SNVBR116SPRJ.csv?v=' + Date.now(), {cache:'no-store'});
    if(!resp.ok) return;
    let text = await resp.text(); if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
    const head = lines.shift().split(';');
    const iKm = findColumnIndex(head, ['km']), iLat = findColumnIndex(head, ['lat','latitude']), iLon = findColumnIndex(head, ['lon','long','longitude']);
    kmDataset = lines.map(l=>{ const r = l.split(';'); return { km:parsePt(r[iKm]), lat:parsePt(r[iLat]), lon:parsePt(r[iLon]) }; })
                     .filter(p => Number.isFinite(p.km) && Number.isFinite(p.lat) && Number.isFinite(p.lon));
  }catch(e){}
}

function updateKMChip(){
  if(!lastPos || !kmDataset.length) return;
  let best = null, bd = Infinity;
  for(let i=0; i<kmDataset.length; i++){
    const p = kmDataset[i];
    const d = hav(lastPos.lat, lastPos.lon, p.lat, p.lon);
    if(d < bd){ bd = d; best = p; }
  }
  if(best) kmValue.textContent = (Math.round(best.km * 100) / 100).toFixed(2).replace('.', ',');
}

function startGPS(){
  if(!('geolocation' in navigator)) return;
  navigator.geolocation.watchPosition(p => {
    lastPos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
    updateGpsStatus();
    render();
    updateKMChip();
  }, null, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
}

btnSend.addEventListener('click', ()=>{
  if(!lastPos) return;
  const items = nearestN(lastPos.lat, lastPos.lon, Number(qtySel.value || 10));
  
  let tx = `${nowBR()}\ngps: ${lastPos.lat.toFixed(6)},${lastPos.lon.toFixed(6)} (${fmtAcc(lastPos.acc)})\n\n`;
  items.forEach(o => {
    tx += `id: ${o.id} - distância: ${getRangeText(o.d, lastPos.acc)}\n`;
  });
  if(chkMaps.checked){
    tx += '\nmapas:\n';
    items.forEach(o => tx += `${o.id}: https://maps.google.com/?q=${o.lat.toFixed(6)},${o.lon.toFixed(6)}\n`);
  }
  window.open('https://wa.me/?text='+encodeURIComponent(tx),'_blank');
});

qtySel.addEventListener('change', ()=>{
  currentRenderedKey = "";
  render();
});

(function boot(){
  loadCSV();
  loadKMCSV();
  startGPS();
})();
</script>
</body>
</html>
