<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Estável - Atualização a cada 5s</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #painel-busca {
            padding: 12px 16px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
        }

        #campo-pesquisa {
            padding: 8px 12px;
            font-size: 14px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #status-atualizacao {
            font-size: 13px;
            color: #666;
            font-style: italic;
        }

        #mapa {
            flex: 1;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="painel-busca">
        <input type="text" id="campo-pesquisa" placeholder="Digite para pesquisar..." oninput="aoDigitar()">
        <span id="status-atualizacao">Aguardando interações...</span>
    </div>

    <div id="mapa"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Inicialização do Mapa
        const mapa = L.map('mapa').setView([-23.55052, -46.633309], 12); // Posição inicial (Ex: São Paulo)

        // Camada de tiles (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(mapa);

        // Armazena os marcadores ativos em memória para evitar apagar/recriar desnecessariamente
        const marcadoresAtivos = {};
        
        let timerAtualizacao = null;
        let usuarioInteragindo = false;

        const elementoStatus = document.getElementById('status-atualizacao');

        // 2. Função principal para buscar e atualizar os dados no mapa
        function atualizarMapa() {
            if (usuarioInteragindo) {
                elementoStatus.innerText = "Usuário movendo o mapa... atualização pausada.";
                return;
            }

            elementoStatus.innerText = "Atualizando dados do mapa...";

            // Simulação de dados retornados de uma API/Pesquisa
            const novosDados = obterDadosSimulados();

            // Atualização ESTÁVEL: Reutiliza marcadores existentes e remove apenas os que saíram
            const idsNovos = novosDados.map(item => item.id);

            // Remove marcadores que não estão mais na nova lista
            Object.keys(marcadoresAtivos).forEach(id => {
                if (!idsNovos.includes(Number(id))) {
                    mapa.removeLayer(marcadoresAtivos[id]);
                    delete marcadoresAtivos[id];
                }
            });

            // Adiciona ou atualiza os marcadores atuais
            novosDados.forEach(item => {
                if (marcadoresAtivos[item.id]) {
                    // Se o marcador já existe, atualiza apenas a posição sem piscar a tela
                    marcadoresAtivos[item.id].setLatLng([item.lat, item.lng]);
                } else {
                    // Se é um marcador novo, cria e adiciona ao mapa
                    const marcador = L.marker([item.lat, item.lng])
                        .bindPopup(`<b>${item.titulo}</b>`);
                    
                    marcador.addTo(mapa);
                    marcadoresAtivos[item.id] = marcador;
                }
            });

            elementoStatus.innerText = "Mapa atualizado! Próxima verificação após 5s de inatividade.";
        }

        // 3. Função de Agendamento (Debounce de 5 segundos)
        function agendarAtualizacao() {
            elementoStatus.innerText = "Aguardando 5 segundos de inatividade para atualizar...";
            
            // Cancela o timer anterior se o usuário realizou uma nova ação antes dos 5s
            if (timerAtualizacao) {
                clearTimeout(timerAtualizacao);
            }

            // Define o novo timer para 5000 ms (5 segundos)
            timerAtualizacao = setTimeout(() => {
                atualizarMapa();
            }, 5000);
        }

        // 4. Eventos de Interação com o Mapa
        mapa.on('movestart zoomstart', () => {
            usuarioInteragindo = true;
            if (timerAtualizacao) clearTimeout(timerAtualizacao);
            elementoStatus.innerText = "Navegando no mapa...";
        });

        mapa.on('moveend zoomend', () => {
            usuarioInteragindo = false;
            agendarAtualizacao();
        });

        // Evento de digitação no campo de pesquisa
        function aoDigitar() {
            agendarAtualizacao();
        }

        // 5. Dados simulados para teste
        function obterDadosSimulados() {
            const centro = mapa.getCenter();
            return [
                { id: 1, titulo: "Ponto de Manutenção A", lat: centro.lat + 0.005, lng: centro.lng + 0.005 },
                { id: 2, titulo: "Ponto de Manutenção B", lat: centro.lat - 0.005, lng: centro.lng - 0.005 },
                { id: 3, titulo: "Equipe em Campo C", lat: centro.lat + 0.008, lng: centro.lng - 0.003 }
            ];
        }

        // Executa uma carga inicial
        atualizarMapa();
    </script>
</body>
</html>
