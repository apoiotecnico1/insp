<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>Sistema Integrado de Apoio & Inspeção</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg: #000000;
            --card: #111111;
            --border: #333333;
            --accent: #ffd600;
            --green: #00e676;
            --placa-verde: rgba(0, 121, 52, 0.7);
            --text: #ffffff;
            --bad: #ff1744;
            --warn: #ff9100;
            --glass: rgba(10, 10, 10, 0.95);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body { background: var(--bg); color: var(--text); font-family: var(--font); overflow-x: hidden; min-height: 100vh; }

        /* ================= TELA INICIAL (MENU) ================= */
        #main-menu {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            text-transform: lowercase;
        }

        .menu-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent);
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .menu-subtitle {
            font-size: 0.95rem;
            color: #888;
            margin-bottom: 30px;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 320px;
        }

        .btn-menu {
            padding: 18px 20px;
            font-size: 1.05rem;
            font-weight: 900;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: lowercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-menu:active {
            transform: scale(0.97);
            border-color: var(--accent);
            background: #1a1a1a;
        }

        .btn-menu-primary {
            background: var(--accent);
            color: #000000;
            border-color: var(--accent);
        }

        /* CONTAINER DOS MÓDULOS */
        .app-module {
            display: none;
            width: 100vw;
            min-height: 100vh;
        }

        .app-module.active {
            display: block;
        }

        /* ================= MÓDULO 1: APOIO LOCALIZAÇÃO ================= */
        #mod-apoio {
            line-height: 1.2;
            padding: 10px;
            text-transform: lowercase;
        }

        /* PAINEL DE BUSCA DE ID ADICIONADO */
        .search-id-box {
            background: var(--card);
            border: 2px solid var(--accent);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-id-title {
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--accent);
            text-transform: lowercase;
        }

        .search-id-input-group {
            display: flex;
            gap: 6px;
        }

        .search-id-input-group input {
            flex: 1;
            padding: 10px;
            font-family: var(--font);
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 6px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #fff;
            text-transform: lowercase;
        }

        .search-id-input-group button {
            padding: 0 14px;
            font-family: var(--font);
            font-size: 0.9rem;
            font-weight: 900;
            border: 0;
            border-radius: 6px;
            background: var(--accent);
            color: #000;
            cursor: pointer;
        }

        .search-result-card {
            background: #222000;
            border: 2px solid var(--accent);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }

        .km-box {
            background: #00875a;
            border: 3px solid #ffffff;
            border-radius: 8px;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 10px;
        }

        .km-label { font-size: 1rem; font-weight: 900; color: #ffffff; letter-spacing: 0.05em; }
        .km-value { font-size: 2.5rem; font-weight: 900; color: #ffffff; line-height: 1; }

        .status-box {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
        }

        .ok { color: var(--green); border-color: var(--green); }
        .warn { color: var(--warn); border-color: var(--warn); }
        .bad { color: var(--bad); border-color: var(--bad); }

        .card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        button#btnSend {
            width: 100%;
            min-height: 40px;
            padding: 8px 12px;
            font-family: var(--font);
            font-size: 0.95rem;
            font-weight: 900;
            border: 0;
            border-radius: 6px;
            background: var(--green);
            color: #000000;
            cursor: pointer;
            text-transform: lowercase;
        }

        button#btnSend:disabled { background: #222222; color: #555555; }

        .controls { display: flex; gap: 12px; margin-top: 8px; align-items: center; }
        .controls label { display: flex; align-items: center; gap: 4px; font-size: 0.85rem; font-weight: 800; }

        select {
            padding: 4px 8px;
            font-family: var(--font);
            font-size: 0.9rem;
            font-weight: 900;
            border-radius: 4px;
            border: 1px solid #444444;
            background: #222222;
            color: #ffffff;
        }

        input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }

        ul.apoio-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
        ul.apoio-list li {
            border: 2px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            background: #181818;
            font-weight: 800;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        ul.apoio-list li.nearest { background: #222000; border: 3px solid var(--accent); color: #ffffff; }

        .item-header { display: flex; justify-content: space-between; align-items: center; font-size: 1rem; }
        ul.apoio-list li.nearest .id-val, ul.apoio-list li.nearest .dist-val { color: var(--accent); font-size: 1.05rem; font-weight: 900; }
        .id-val { font-size: 1rem; font-weight: 800; color: #ffffff; }
        .dist-val { color: var(--accent); font-size: 0.95rem; font-weight: 800; }

        .mini-map {
            width: 100%;
            height: 130px;
            border-radius: 4px;
            border: 1px solid #444444;
            overflow: hidden;
            position: relative;
            background: #000000;
        }
        .mini-map iframe { width: 100%; height: 100%; border: 0; }
        .skeleton { height: 42px; background: #222222; border-radius: 6px; }

        /* ================= MÓDULO 2: INSPEÇÃO FOTOGRÁFICA ================= */
        #mod-inspecao {
            position: relative;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #safety-gate { position: absolute; inset: 0; background: #000; z-index: 1500; display: flex; align-items: center; justify-content: center; }
        .alert-box { border: 1px solid #333; padding: 40px; border-radius: 15px; text-align: center; background: #0a0a0a; max-width: 90%; }
        .btn-aware { background: var(--accent); color: #000; border: none; padding: 20px 50px; font-weight: 900; border-radius: 8px; cursor: pointer; margin-top: 20px; }

        #app-shell { position: relative; width: 100vw; height: 100vh; visibility: hidden; }
        #vid { width: 100%; height: 100%; object-fit: cover; cursor: crosshair; }

        #km-hud { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            background: var(--placa-verde); 
            padding: 10px 20px; 
            border: 3px solid rgba(255, 255, 255, 0.7); 
            border-radius: 8px; 
            z-index: 100; 
            pointer-events: none; 
            min-width: 160px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-align: center;
        }
        .hud-pulse { transform: scale(1.05); border-color: var(--accent) !important; }

        #br-txt { font-size: 0.85rem; font-weight: 800; display: block; width: 100%; padding-bottom: 2px; margin-bottom: 2px; border-bottom: 1px solid rgba(255,255,255,0.3); }
        #km-txt { font-size: 2.2rem; font-weight: 900; line-height: 1; }

        #rec-tag { 
            position: absolute; 
            top: 40px; 
            right: 15px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            background: rgba(0,0,0,0.5); 
            padding: 5px 12px; 
            border-radius: 15px; 
            opacity: 0; 
            pointer-events: none; 
            z-index: 100;
        }
        #rec-tag span { font-size: 0.7rem; font-weight: bold; color: #eee; }
        .dot { width: 8px; height: 8px; background: #f00; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        #ui-controls { 
            position: absolute; 
            bottom: 40px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 20px; 
            z-index: 500; 
            transition: opacity 0.3s ease, visibility 0.3s;
        }
        .ui-hidden { opacity: 0; visibility: hidden; }

        .btn-main { border: none; padding: 18px 40px; border-radius: 12px; font-weight: 900; text-transform: uppercase; cursor: pointer; min-width: 160px; }
        #btn-start { background: var(--accent); color: #000; }
        #btn-stop { background: var(--bad); color: #fff; display: none; }
        #gear-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }

        #settings-panel { position: fixed; right: -350px; top: 0; width: 320px; height: 100%; background: var(--glass); backdrop-filter: blur(20px); z-index: 4000; padding: 60px 25px; transition: 0.4s; overflow-y: auto; }
        #settings-panel.open { right: 0; }
        #settings-panel label { display: block; margin-top: 15px; font-size: 0.8rem; color: var(--accent); text-transform: uppercase; font-weight: bold; }
        #settings-panel input, #settings-panel select { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px; margin-top: 5px; }

        canvas#c { display: none; }
        #flash { position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 1000; transition: opacity 0.05s ease-out; }
    </style>
</head>
<body>

<div id="main-menu">
    <div class="menu-title">sistema de apoio</div>
    <div class="menu-subtitle">selecione a ferramenta desejada</div>
    <div class="menu-buttons">
        <button class="btn-menu btn-menu-primary" onclick="openModule('apoio')">
            📍 apoio localização
        </button>
        <button class="btn-menu" onclick="openModule('inspecao')">
            📷 inspeção fotográfica
        </button>
    </div>
</div>

<div id="mod-apoio" class="app-module">
    <div class="search-id-box">
        <span class="search-id-title">🔍 pesquisar por id específico</span>
        <div class="search-id-input-group">
            <input type="text" id="inputIdSearch" placeholder="digite o id exato..." onkeydown="if(event.key==='Enter') searchById()" />
            <button onclick="searchById()">buscar</button>
            <button onclick="clearSearchId()" style="background:#333; color:#fff;">limpar</button>

    </div>

    <div class="km-box">
        <span class="km-label">km</span>

    </div>

    <div id="gpsStatus" class="status-box bad">
        gps: aguardando...
    </div>

    <div class="card">
        <button id="btnSend" disabled>whatsapp</button>
        <div class="controls">
            <label>
                qtd:
                <select id="qty">
                    <option value="1">1</option>
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                </select>

            <label>
                <input type="checkbox" id="chkMaps" />
                maps
            </label>
        </div>
    </div>

    <div class="card">
        <ul id="list" class="apoio-list">
            <li class="skeleton"></li>
            <li class="skeleton"></li>
        </ul>

</div>

<div id="mod-inspecao" class="app-module">
    <div id="flash"></div>

    <div id="safety-gate">
        <div class="alert-box">
            <h2 style="color:var(--accent); margin-bottom:10px;">SISTEMA DE APOIO</h2>
            <p style="margin-bottom:10px; font-size: 1rem; font-weight: bold;">Captura Automática + Foto Manual</p>
            <button class="btn-aware" onclick="startAppInspecao()">ATIVAR SISTEMA</button>
        </div>
    </div>

    <div id="settings-panel">
        <div onclick="toggleSet()" style="color:var(--accent); cursor:pointer; margin-bottom:20px; font-weight: bold;">← FECHAR</div>
        <label>Câmera Ativa</label>
        <select id="cam-select" onchange="switchCam(this.value)"></select>
        <label>Intervalo (ms)</label>
        <input type="number" id="cfg-int" value="200">
        <label>Fotos/Lote</label>
        <input type="number" id="cfg-lote" value="50">
    </div>

    <div id="app-shell">
        <video id="vid" autoplay playsinline muted onclick="handleTouch()"></video>
        
        <div id="km-hud">
            <span id="br-txt"></span>
            <h1 id="km-txt">Km ---</h1>
        </div>

        <div id="rec-tag"><div class="dot"></div><span>Registrando fotos no PDF...</span></div>

        <div id="ui-controls">
            <div id="gear-btn" onclick="toggleSet()">⚙</div>
            <button id="btn-start" class="btn-main" onclick="startCapture()">INICIAR</button>
            <button id="btn-stop" class="btn-main" onclick="stopCapture()">FINALIZAR</button>
        </div>
    </div>

    <canvas id="c"></canvas>
</div>

<script>
/* ================= NAVEGAÇÃO ENTRE TELAS ================= */
function openModule(modId) {
    document.getElementById('main-menu').style.display = 'none';
    document.querySelectorAll('.app-module').forEach(m => m.classList.remove('active'));
    
    if (modId === 'apoio') {
        document.getElementById('mod-apoio').classList.add('active');
        initApoioLocalizacao();
    } else if (modId === 'inspecao') {
        document.getElementById('mod-inspecao').classList.add('active');
    }
}

/* ================= LÓGICA DO MÓDULO 1: APOIO LOCALIZAÇÃO ================= */
const ACC_GREEN = 15, ACC_YELLOW = 35;
let datasetApoio = [], kmDatasetApoio = [], lastPosApoio = null;
let currentRenderedKey = "";
let apoioInited = false;
let currentSearchedIdItem = null; // Guarda o item consultado pela busca por ID

const gpsStatus = document.getElementById('gpsStatus');
const btnSend = document.getElementById('btnSend');
const chkMaps = document.getElementById('chkMaps');
const qtySel = document.getElementById('qty');
const listEl = document.getElementById('list');
const kmValue = document.getElementById('kmValue');

function normalizeStr(s){ return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9_ ]+/g,' ').replace(/\s+/g,' '); }
function findColumnIndex(headers, candidates){ const map=headers.map(h=>normalizeStr(h)); for(const c of candidates){ const i=map.indexOf(c); if(i>=0) return i; } return -1; }
function parsePt(v){ if(v==null) return NaN; const s=String(v).trim(); return /,\d{1,}$/.test(s)? Number(s.replace(/\./g,'').replace(',','.')): Number(s); }

function hav(a,b,c,d){
  const p=0.017453292519943295, cos=Math.cos;
  const x = 0.5 - cos((c - a) * p)/2 + cos(a * p) * cos(c * p) * (1 - cos((d - b) * p))/2;
  return 12742000 * Math.asin(Math.sqrt(x));
}

function nearestN(lat,lon,n=10){
  if(!datasetApoio.length) return [];
  const arr = datasetApoio.map(p => ({id:p.id, lat:p.lat, lon:p.lon, d:hav(lat,lon,p.lat,p.lon)}));
  arr.sort((a,b)=>a.d-b.d);
  return arr.slice(0, n);
}

function fmtAcc(a){ return (a==null||!Number.isFinite(a))?'—':('±'+Math.round(a)+'m'); }
function nowBR(){ return new Date().toLocaleString('pt-BR').toLowerCase(); }

function getRangeText(dist, acc) {
  const err = (acc != null && Number.isFinite(acc)) ? Math.round(acc) : 0;
  const d = Math.round(dist);
  const min = Math.max(0, d - err);
  const max = d + err;
  return `${min}m a ${max}m`;
}

/* NOVA FUNÇÃO: PESQUISAR POR ID ADICIONADA */
function searchById() {
    const term = normalizeStr(document.getElementById('inputIdSearch').value);
    const resArea = document.getElementById('searchResultArea');
    if (!term) {
        resArea.style.display = 'none';
        resArea.innerHTML = '';
        currentSearchedIdItem = null;
        return;
    }

    if (!datasetApoio.length) {
        resArea.style.display = 'block';
        resArea.innerHTML = `<div style="color:var(--warn); font-size:0.85rem; padding:4px;">carregando dados, tente novamente...</div>`;
        return;
    }

    const found = datasetApoio.find(p => normalizeStr(p.id) === term || normalizeStr(p.id).includes(term));

    if (!found) {
        resArea.style.display = 'block';
        resArea.innerHTML = `<div style="color:var(--bad); font-size:0.85rem; padding:4px; font-weight:800;">id "${term}" não encontrado.</div>`;
        currentSearchedIdItem = null;
        return;
    }

    currentSearchedIdItem = found;
    resArea.style.display = 'block';
    renderSearchedIdResult();
}

function renderSearchedIdResult() {
    if (!currentSearchedIdItem) return;
    const resArea = document.getElementById('searchResultArea');
    const item = currentSearchedIdItem;

    let distText = "aguardando gps...";
    if (lastPosApoio) {
        const d = hav(lastPosApoio.lat, lastPosApoio.lon, item.lat, item.lon);
        distText = `distância: ${getRangeText(d, lastPosApoio.acc)}`;
    }

    resArea.innerHTML = `
        <div class="search-result-card">
            <div class="item-header">
                <span class="id-val" style="color:var(--accent);">id: ${item.id}</span>
                <span class="dist-val" id="search-dist-val">${distText}</span>
            </div>
            <div style="font-size:0.75rem; color:#aaa;">coords: ${item.lat.toFixed(6)}, ${item.lon.toFixed(6)}</div>
            <div class="mini-map">
                <iframe 
                  src="https://maps.google.com/maps?q=${item.lat},${item.lon}&t=k&z=19&ie=UTF8&iwloc=&output=embed" 
                  loading="lazy">
                </iframe>
            </div>
        </div>
    `;
}

function clearSearchId() {
    document.getElementById('inputIdSearch').value = '';
    const resArea = document.getElementById('searchResultArea');
    resArea.style.display = 'none';
    resArea.innerHTML = '';
    currentSearchedIdItem = null;
}

function updateGpsStatus(){
  if(!lastPosApoio || lastPosApoio.acc==null){ 
    gpsStatus.className='status-box bad'; 
    gpsStatus.textContent='gps: buscando...'; 
    return; 
  }
  const a=Math.round(lastPosApoio.acc);
  if(a<=ACC_GREEN){ 
    gpsStatus.className='status-box ok'; 
    gpsStatus.textContent=`gps ok (${fmtAcc(a)})`; 
  } else if(a<=ACC_YELLOW){ 
    gpsStatus.className='status-box warn'; 
    gpsStatus.textContent=`gps medio (${fmtAcc(a)})`; 
  } else { 
    gpsStatus.className='status-box bad'; 
    gpsStatus.textContent=`gps fraco (${fmtAcc(a)})`; 
  }
}

function renderApoio(){
  if(!lastPosApoio || !datasetApoio.length) return;

  // Atualizar distância do card de busca por ID caso esteja visível
  if (currentSearchedIdItem) {
      renderSearchedIdResult();
  }

  const qty = Number(qtySel.value || 10);
  const items = nearestN(lastPosApoio.lat, lastPosApoio.lon, qty);
  const itemKey = items.map(i => i.id).join(',');

  if(itemKey === currentRenderedKey){
    items.forEach((o, idx) => {
      const el = document.getElementById(`dist-val-${idx}`);
      if(el) el.textContent = `distância: ${getRangeText(o.d, lastPosApoio.acc)}`;
    });
    btnSend.disabled = false;
    return;
  }

  currentRenderedKey = itemKey;
  listEl.innerHTML = '';
  const frag = document.createDocumentFragment();

  items.forEach((o, idx) => {
    const li = document.createElement('li');
    if(idx === 0) li.classList.add('nearest');

    li.innerHTML = `
      <div class="item-header">
        <span class="id-val">${o.id}</span>
        <span class="dist-val" id="dist-val-${idx}">distância: ${getRangeText(o.d, lastPosApoio.acc)}</span>
      </div>
      <div class="mini-map">
        <iframe 
          src="https://maps.google.com/maps?q=${o.lat},${o.lon}&t=k&z=19&ie=UTF8&iwloc=&output=embed" 
          loading="lazy">
        </iframe>
      </div>
    `;
    frag.appendChild(li);
  });

  listEl.appendChild(frag);
  btnSend.disabled = false;
}

async function loadCSVApoio(){
  try{
    let resp = await fetch('dados.csv?v='+Date.now(), {cache:'no-store'}).catch(()=>null);
    if(!resp || !resp.ok) resp = await fetch('Dados_Completos_Grupo_2_all.csv?v='+Date.now(), {cache:'no-store'});
    if(!resp.ok) return;
    
    let text = await resp.text(); if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
    const lines = text.split(/\r?\n/).filter(l=>l.trim()!=='');
    const head = lines.shift().split(';');
    const iId=findColumnIndex(head,['id do nox','idnox','id']), iLat=findColumnIndex(head,['latitude','lat']), iLon=findColumnIndex(head,['longitude','lon','long']);
    
    datasetApoio = lines.map(l=>{ const r=l.split(';'); return {id:String(r[iId]||'').trim(), lat:parsePt(r[iLat]), lon:parsePt(r[iLon])}; })
                   .filter(p=>p.id && Number.isFinite(p.lat)&&Number.isFinite(p.lon));
    renderApoio();
  }catch(e){}
}

async function loadKMCSVApoio(){
  try{
    let resp = await fetch('SNVBR116SPRJ.csv?v=' + Date.now(), {cache:'no-store'});
    if(!resp.ok) return;
    let text = await resp.text(); if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
    const head = lines.shift().split(';');
    const iKm = findColumnIndex(head, ['km']), iLat = findColumnIndex(head, ['lat','latitude']), iLon = findColumnIndex(head, ['lon','long','longitude']);
    kmDatasetApoio = lines.map(l=>{ const r = l.split(';'); return { km:parsePt(r[iKm]), lat:parsePt(r[iLat]), lon:parsePt(r[iLon]) }; })
                     .filter(p => Number.isFinite(p.km) && Number.isFinite(p.lat) && Number.isFinite(p.lon));
  }catch(e){}
}

function updateKMChipApoio(){
  if(!lastPosApoio || !kmDatasetApoio.length) return;
  let best = null, bd = Infinity;
  for(let i=0; i<kmDatasetApoio.length; i++){
    const p = kmDatasetApoio[i];
    const d = hav(lastPosApoio.lat, lastPosApoio.lon, p.lat, p.lon);
    if(d < bd){ bd = d; best = p; }
  }
  if(best) kmValue.textContent = (Math.round(best.km * 100) / 100).toFixed(2).replace('.', ',');
}

function startGPSApoio(){
  if(!('geolocation' in navigator)) return;
  navigator.geolocation.watchPosition(p => {
    lastPosApoio = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
    updateGpsStatus();
    renderApoio();
    updateKMChipApoio();
  }, null, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
}

btnSend.addEventListener('click', ()=>{
  if(!lastPosApoio) return;
  const items = nearestN(lastPosApoio.lat, lastPosApoio.lon, Number(qtySel.value || 10));
  
  let tx = `${nowBR()}\ngps: ${lastPosApoio.lat.toFixed(6)},${lastPosApoio.lon.toFixed(6)} (${fmtAcc(lastPosApoio.acc)})\n\n`;
  items.forEach(o => {
    tx += `id: ${o.id} - distância: ${getRangeText(o.d, lastPosApoio.acc)}\n`;
  });
  if(chkMaps.checked){
    tx += '\nmapas:\n';
    items.forEach(o => tx += `${o.id}: https://maps.google.com/?q=${o.lat.toFixed(6)},${o.lon.toFixed(6)}\n`);
  }
  window.open('https://wa.me/?text='+encodeURIComponent(tx),'_blank');
});

qtySel.addEventListener('change', ()=>{
  currentRenderedKey = "";
  renderApoio();
});

function initApoioLocalizacao(){
    if(apoioInited) return;
    apoioInited = true;
    loadCSVApoio();
    loadKMCSVApoio();
    startGPSApoio();
}


/* ================= LÓGICA DO MÓDULO 2: INSPEÇÃO FOTOGRÁFICA ================= */
let kmDB=[], capturing=false, hDir=null, currentStream=null;
let kmInicialLote = "", buffer = [];
let curLat = "0.0000", curLon = "0.0000";
let wakeLock = null;

const vid = document.getElementById('vid');
const can = document.getElementById('c');
const ctx = can.getContext('2d');
const flashDiv = document.getElementById('flash');
const kmHud = document.getElementById('km-hud');
const uiControls = document.getElementById('ui-controls');

async function startAppInspecao() {
    try {
        hDir = await window.showDirectoryPicker({ mode: 'readwrite' });
        document.getElementById('safety-gate').style.display = 'none';
        document.getElementById('app-shell').style.visibility = 'visible';
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
        listCams(); loadCSVInspecao(); initGPSInspecao();
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } catch(e) { alert("Permissão de pasta necessária."); }
}

async function listCams() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const vids = devices.filter(d => d.kind === 'videoinput');
    const sel = document.getElementById('cam-select');
    sel.innerHTML = vids.map((d, i) => `<option value="${d.deviceId}">Câmera ${i+1}</option>`).join('');
    if(vids.length) switchCam(vids[vids.length-1].deviceId);
}

async function switchCam(id) {
    if (currentStream) currentStream.getTracks().forEach(t => t.stop());
    currentStream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: id, width: 1920, height: 1080 } });
    vid.srcObject = currentStream;
    vid.onloadedmetadata = () => { can.width = vid.videoWidth; can.height = vid.videoHeight; };
}

function handleTouch() {
    takeManualPhoto();
    if (uiControls.classList.contains('ui-hidden')) {
        uiControls.classList.remove('ui-hidden');
    }
}

async function takeManualPhoto() {
    if(!hDir) return;
    flashDiv.style.opacity = "0.2"; 
    kmHud.classList.add('hud-pulse');
    setTimeout(() => { flashDiv.style.opacity = "0"; kmHud.classList.remove('hud-pulse'); }, 70);
    
    const currentKm = document.getElementById('km-txt').innerText.replace("Km ", "");
    ctx.drawImage(vid, 0, 0, can.width, can.height);
    const bh = can.height * 0.10;
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, can.height - bh, can.width, bh);
    ctx.fillStyle = "#fff"; ctx.font = `bold ${bh * 0.35}px Arial`;
    ctx.fillText(`Km ${currentKm}`, 20, can.height - (bh * 0.55));
    ctx.font = `${bh * 0.22}px Arial`;
    ctx.fillText(`${new Date().toLocaleString('pt-BR')} | GPS: ${curLat}, ${curLon}`, 20, can.height - (bh * 0.25));
    
    const blob = await new Promise(res => can.toBlob(res, 'image/jpeg', 0.95));
    const fileName = `MANUAL_Km_${currentKm}_${Date.now()}.jpg`;
    const fileHandle = await hDir.getFileHandle(fileName, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(blob); await writable.close();
}

function startCapture() {
    capturing = true;
    buffer = [];
    kmInicialLote = document.getElementById('km-txt').innerText.replace("Km ", "");
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    document.getElementById('rec-tag').style.opacity = '1';
    uiControls.classList.add('ui-hidden'); 
    captureLoop();
}

function stopCapture() {
    capturing = false;
    if(buffer.length > 0) {
        const kmFim = document.getElementById('km-txt').innerText.replace("Km ", "");
        savePDF([...buffer], kmInicialLote, kmFim);
    }
    buffer = [];
    document.getElementById('btn-start').style.display = 'block';
    document.getElementById('btn-stop').style.display = 'none';
    document.getElementById('rec-tag').style.opacity = '0';
    uiControls.classList.remove('ui-hidden'); 
}

function captureLoop() {
    if (!capturing) return;
    const currentKm = document.getElementById('km-txt').innerText.replace("Km ", "");
    const limiteLote = parseInt(document.getElementById('cfg-lote').value) || 50;

    ctx.drawImage(vid, 0, 0, can.width, can.height);
    buffer.push({ 
        img: can.toDataURL('image/jpeg', 0.5), 
        km: currentKm, 
        ts: new Date().toLocaleString('pt-BR'),
        gps: `${curLat}, ${curLon}`
    });

    if (buffer.length >= limiteLote) {
        savePDF([...buffer], kmInicialLote, currentKm);
        buffer = []; 
        kmInicialLote = currentKm;
    }
    setTimeout(captureLoop, parseInt(document.getElementById('cfg-int').value) || 200);
}

async function savePDF(dataList, kmIni, kmFim) {
    const doc = new jspdf.jsPDF(can.width < can.height ? 'p' : 'l', 'mm', 'a4');
    const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
    for (let i = 0; i < dataList.length; i++) {
        if (i > 0) doc.addPage();
        await new Promise(res => {
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0);
                const bh = can.height * 0.10;
                ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, can.height - bh, can.width, bh);
                ctx.fillStyle = "#fff"; ctx.font = `bold ${bh * 0.35}px Arial`;
                ctx.fillText(`Km ${dataList[i].km}`, 20, can.height - (bh * 0.55));
                ctx.font = `${bh * 0.22}px Arial`;
                ctx.fillText(`${dataList[i].ts} | GPS: ${dataList[i].gps}`, 20, can.height - (bh * 0.25));
                doc.addImage(can.toDataURL('image/jpeg', 0.7), 'JPEG', 0, 0, pw, ph);
                res();
            };
            img.src = dataList[i].img;
        });
    }
    const fileName = `RELATORIO_Km_${kmIni}_ao_${kmFim}_${Date.now()}.pdf`;
    const fileHandle = await hDir.getFileHandle(fileName, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(doc.output('blob'));
    await writable.close();
}

function initGPSInspecao() {
    navigator.geolocation.watchPosition(p => {
        curLat = p.coords.latitude.toFixed(6); curLon = p.coords.longitude.toFixed(6);
        if (!kmDB.length) return;
        let best = null, minD = Infinity;
        for (const pt of kmDB) {
            const d = Math.hypot(pt.lt - p.coords.latitude, pt.ln - p.coords.longitude);
            if (d < minD) { minD = d; best = pt; }
        }
        if (best) {
            document.getElementById('km-txt').innerText = "Km " + best.km;
            document.getElementById('br-txt').innerText = "";
        }
    }, null, { enableHighAccuracy: true });
}

async function loadCSVInspecao() {
    try {
        const r = await fetch('SNVBR116SPRJ.csv');
        const t = await r.text();
        const rows = t.split('\n').filter(l => l.includes(';'));
        const h = rows.shift().split(';').map(v => v.trim().toLowerCase());
        const ik=h.indexOf('km'), ilt=h.findIndex(x=>x.includes('lat')), iln=h.findIndex(x=>x.includes('lon'));
        kmDB = rows.map(r => {
            const c = r.split(';');
            return { km: c[ik], lt: parseFloat(c[ilt].replace(',','.')), ln: parseFloat(c[iln].replace(',','.')) };
        }).filter(d => !isNaN(d.lt));
    } catch(e) {}
}

function toggleSet() { document.getElementById('settings-panel').classList.toggle('open'); }
</script>
