<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nexus Core — Sistema Integrado de Apoio & Inspeção</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#ecfeff', 500: '#06b6d4', 600: '#0891b2', 900: '#164e63', 950: '#083344' }
                    }
                }
            }
        }
    </script>
    <!-- jsPDF CDN para Relatórios -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow-cyan { box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.35); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-cyan-500 selection:text-white">

    <!-- Top Header -->
    <header class="sticky top-0 z-50 glass border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-600 flex items-center justify-center glow-cyan shadow-lg">
                <i data-lucide="cpu" class="w-5 h-5 text-white"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-tight bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent">Nexus Core v5</h1>
                <p class="text-xs text-slate-400 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Sistema Operacional de Campo Ativo
                </p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="App.exportDataJSON()" title="Exportar Backup" class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-cyan-400 hover:border-cyan-500/50 transition-all">
                <i data-lucide="download" class="w-4 h-4"></i>
            </button>
            <button onclick="App.toggleTheme()" class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-cyan-400 transition-all">
                <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-5 pb-28 space-y-6">

        <!-- Real-Time Telemetry & KM Tracker Card -->
        <section class="glass rounded-2xl p-5 border border-slate-800/80 relative overflow-hidden shadow-2xl">
            <div class="absolute -right-10 -top-10 w-40 h-40 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-2.5">
                    <div class="p-2 rounded-lg bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                        <i data-lucide="gauge" class="w-5 h-5"></i>
                    </div>
                    <h2 class="font-semibold text-slate-200">Telemetria & KM em Tempo Real</h2>
                </div>
                <span id="tracker-status-badge" class="px-2.5 py-1 rounded-full text-[10px] font-semibold uppercase tracking-wider bg-slate-800 text-slate-400 border border-slate-700">Parado</span>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
                <div class="bg-slate-900/80 rounded-xl p-3 border border-slate-800">
                    <span class="text-xs text-slate-400 block mb-1">Distância Percorrida</span>
                    <div class="text-2xl font-bold font-mono text-cyan-400"><span id="metric-distance">0.00</span> <span class="text-xs text-slate-400 font-normal">km</span></div>
                </div>
                <div class="bg-slate-900/80 rounded-xl p-3 border border-slate-800">
                    <span class="text-xs text-slate-400 block mb-1">Tempo Decorrido</span>
                    <div class="text-2xl font-bold font-mono text-slate-200" id="metric-time">00:00:00</div>
                </div>
                <div class="bg-slate-900/80 rounded-xl p-3 border border-slate-800">
                    <span class="text-xs text-slate-400 block mb-1">Velocidade Atual</span>
                    <div class="text-2xl font-bold font-mono text-emerald-400"><span id="metric-speed">0.0</span> <span class="text-xs text-slate-400 font-normal">km/h</span></div>
                </div>
                <div class="bg-slate-900/80 rounded-xl p-3 border border-slate-800">
                    <span class="text-xs text-slate-400 block mb-1">Precisão GPS</span>
                    <div class="text-2xl font-bold font-mono text-slate-300"><span id="metric-gps">-</span> <span class="text-xs text-slate-400 font-normal">m</span></div>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button id="btn-toggle-tracker" onclick="Tracker.toggle()" class="flex-1 py-3 px-4 rounded-xl font-semibold bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white shadow-lg shadow-cyan-900/30 flex items-center justify-center space-x-2 transition-all">
                    <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                    <span>Iniciar Monitoramento</span>
                </button>
                <button onclick="Tracker.reset()" class="px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-red-400 hover:border-red-500/30 transition-all">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                </button>
            </div>
        </section>

        <!-- Quick Action & Filter Bar -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div class="md:col-span-2 relative">
                <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="input-search" oninput="App.handleSearch(this.value)" placeholder="Pesquisar ativos, códigos, locais..." class="w-full bg-slate-900/90 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-all">
            </div>
            <button onclick="App.openModal()" class="w-full bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 font-semibold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 transition-all">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                <span>Novo Registro</span>
            </button>
        </div>

        <!-- Dynamic List of Inspections / Assets -->
        <section class="space-y-3">
            <div class="flex items-center justify-between px-1">
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Ativos & Inspeções Mapeadas</h3>
                <span id="counter-items" class="text-xs bg-slate-900 px-2.5 py-1 rounded-full border border-slate-800 text-slate-400 font-mono">0 itens</span>
            </div>

            <div id="items-container" class="space-y-3">
                <!-- Injetado dinamicamente via JS -->
            </div>
        </section>
    </main>

    <!-- Floating / Fixed Bottom Navigation / Quick Actions Bar -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-slate-800/80 px-6 py-3 flex items-center justify-around z-40 max-w-lg mx-auto md:rounded-t-2xl">
        <button onclick="App.switchTab('home')" id="nav-home" class="flex flex-col items-center space-y-1 text-cyan-400 transition-colors">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Início</span>
        </button>
        <button onclick="App.openModal()" class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-600 to-blue-600 flex items-center justify-center text-white glow-cyan shadow-lg -mt-5 hover:scale-105 transition-transform">
            <i data-lucide="plus" class="w-6 h-6"></i>
        </button>
        <button onclick="App.generatePDFReport()" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 transition-colors">
            <i data-lucide="file-text" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Gerar PDF</span>
        </button>
    </nav>

    <!-- Modal Form for New / Edit Inspection -->
    <div id="item-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-lg rounded-2xl border border-slate-800 p-6 space-y-5 shadow-2xl relative animate-in fade-in zoom-in duration-200">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <h3 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                    <i data-lucide="clipboard-edit" class="w-5 h-5 text-cyan-400"></i>
                    <span id="modal-title">Novo Registro de Ativo</span>
                </h3>
                <button onclick="App.closeModal()" class="text-slate-400 hover:text-slate-200 p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="inspection-form" onsubmit="App.saveItem(event)" class="space-y-4">
                <input type="hidden" id="item-id">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">Identificação / Código do Ativo (ex: Luminiária #402)</label>
                    <input type="text" id="item-title" required placeholder="Ex: Poste 14 - Setor Sul" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5">Setor / Área</label>
                        <input type="text" id="item-sector" required placeholder="Ex: Rodovia SP-100" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5">Status Técnico</label>
                        <select id="item-status" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                            <option value="Operacional">Operacional</option>
                            <option value="Manutenção Necessária">Manutenção Necessária</option>
                            <option value="Crítico / Inativo">Crítico / Inativo</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">Observações de Campo</label>
                    <textarea id="item-notes" rows="3" placeholder="Insira detalhes técnicos, avarias ou anotações..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 resize-none"></textarea>
                </div>
                <div class="flex items-center justify-end space-x-3 pt-2">
                    <button type="button" onclick="App.closeModal()" class="px-5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 text-sm font-medium hover:bg-slate-800">Cancelar</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 text-white text-sm font-semibold shadow-lg shadow-cyan-900/30 hover:opacity-90">Salvar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        // State Management & Reactive Core
        const State = {
            items: JSON.parse(localStorage.getItem('nexus_items')) || [
                { id: '1', title: 'Luminária LED #102', sector: 'Trecho Norte - KM 12', status: 'Operacional', notes: 'Funcionando perfeitamente após substituição do driver.', date: '30/08/2026' },
                { id: '2', title: 'Painel de Comando Setor B', sector: 'Subestação Central', status: 'Manutenção Necessária', notes: 'Terminais oxidados exigem limpeza corretiva.', date: '30/08/2026' }
            ],
            searchQuery: '',
            tracker: {
                active: false,
                startTime: null,
                elapsedSeconds: 0,
                distance: 0,
                lastCoords: null,
                watchId: null,
                timerInterval: null
            }
        };

        // Real-Time Telemetry & KM Tracker Engine
        const Tracker = {
            toggle() {
                if (State.tracker.active) {
                    this.stop();
                } else {
                    this.start();
                }
            },
            start() {
                State.tracker.active = true;
                State.tracker.startTime = Date.now() - (State.tracker.elapsedSeconds * 1000);
                
                document.getElementById('btn-toggle-tracker').innerHTML = `<i data-lucide="square" class="w-4 h-4 fill-current"></i><span>Parar Monitoramento</span>`;
                document.getElementById('btn-toggle-tracker').className = "flex-1 py-3 px-4 rounded-xl font-semibold bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white shadow-lg shadow-red-900/30 flex items-center justify-center space-x-2 transition-all";
                
                const badge = document.getElementById('tracker-status-badge');
                badge.className = "px-2.5 py-1 rounded-full text-[10px] font-semibold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                badge.innerText = "Em Execução";

                // Start Timer
                State.tracker.timerInterval = setInterval(() => {
                    State.tracker.elapsedSeconds = Math.floor((Date.now() - State.tracker.startTime) / 1000);
                    App.updateTimerDisplay();
                }, 1000);

                // Start Geolocation Watch
                if ('geolocation' in navigator) {
                    State.tracker.watchId = navigator.geolocation.watchPosition(
                        (pos) => {
                            const { latitude, longitude, speed, accuracy } = pos.coords;
                            document.getElementById('metric-gps').innerText = Math.round(accuracy);
                            if (speed !== null && speed >= 0) {
                                document.getElementById('metric-speed').innerText = (speed * 3.6).toFixed(1);
                            }

                            const currentCoords = { lat: latitude, lng: longitude };
                            if (State.tracker.lastCoords) {
                                const dist = Tracker.calcDistance(State.tracker.lastCoords.lat, State.tracker.lastCoords.lng, latitude, longitude);
                                if (dist > 0.003) { // filtro de ruído mínimo (3 metros)
                                    State.tracker.distance += dist;
                                    document.getElementById('metric-distance').innerText = State.tracker.distance.toFixed(2);
                                    State.tracker.lastCoords = currentCoords;
                                }
                            } else {
                                State.tracker.lastCoords = currentCoords;
                            }
                        },
                        (err) => { console.warn('Erro GPS:', err.message); },
                        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
                    );
                }
                lucide.createIcons();
            },
            stop() {
                State.tracker.active = false;
                clearInterval(State.tracker.timerInterval);
                if (State.tracker.watchId !== null && 'geolocation' in navigator) {
                    navigator.geolocation.clearWatch(State.tracker.watchId);
                }

                document.getElementById('btn-toggle-tracker').innerHTML = `<i data-lucide="play" class="w-4 h-4 fill-current"></i><span>Retomar Monitoramento</span>`;
                document.getElementById('btn-toggle-tracker').className = "flex-1 py-3 px-4 rounded-xl font-semibold bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white shadow-lg shadow-cyan-900/30 flex items-center justify-center space-x-2 transition-all";
                
                const badge = document.getElementById('tracker-status-badge');
                badge.className = "px-2.5 py-1 rounded-full text-[10px] font-semibold uppercase tracking-wider bg-slate-800 text-slate-400 border border-slate-700";
                badge.innerText = "Pausado";
                lucide.createIcons();
            },
            reset() {
                this.stop();
                State.tracker.elapsedSeconds = 0;
                State.tracker.distance = 0;
                State.tracker.lastCoords = null;
                document.getElementById('metric-distance').innerText = "0.00";
                document.getElementById('metric-time').innerText = "00:00:00";
                document.getElementById('metric-speed').innerText = "0.0";
                document.getElementById('metric-gps').innerText = "-";
            },
            calcDistance(lat1, lon1, lat2, lon2) {
                const R = 6371; // Raio da Terra em km
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            }
        };

        // Application Controller
        const App = {
            init() {
                this.renderItems();
                lucide.createIcons();
            },
            updateTimerDisplay() {
                const s = State.tracker.elapsedSeconds;
                const hrs = String(Math.floor(s / 3600)).padStart(2, '0');
                const mins = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
                const secs = String(s % 60).padStart(2, '0');
                document.getElementById('metric-time').innerText = `${hrs}:${mins}:${secs}`;
            },
            handleSearch(val) {
                State.searchQuery = val.toLowerCase().trim();
                this.renderItems();
            },
            renderItems() {
                const container = document.getElementById('items-container');
                const filtered = State.items.filter(item => 
                    item.title.toLowerCase().includes(State.searchQuery) ||
                    item.sector.toLowerCase().includes(State.searchQuery) ||
                    item.status.toLowerCase().includes(State.searchQuery) ||
                    item.notes.toLowerCase().includes(State.searchQuery)
                );

                document.getElementById('counter-items').innerText = `${filtered.length} ${filtered.length === 1 ? 'item' : 'itens'}`;

                if (filtered.length === 0) {
                    container.innerHTML = `
                        <div class="glass rounded-2xl p-8 text-center border border-slate-800 text-slate-400 space-y-2">
                            <i data-lucide="search-x" class="w-8 h-8 mx-auto opacity-50"></i>
                            <p class="text-sm font-medium">Nenhum registro encontrado</p>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                container.innerHTML = filtered.map(item => {
                    const statusColor = item.status === 'Operacional' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                                        item.status === 'Manutenção Necessária' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' :
                                        'bg-red-500/10 text-red-400 border-red-500/20';
                    return `
                        <div class="glass rounded-2xl p-4 border border-slate-800/80 hover:border-slate-700 transition-all space-y-3 group">
                            <div class="flex items-start justify-between">
                                <div>
                                    <h4 class="font-bold text-slate-200 text-sm md:text-base">${item.title}</h4>
                                    <span class="text-xs text-cyan-400 font-mono">${item.sector}</span>
                                </div>
                                <span class="px-2.5 py-1 rounded-full text-[10px] font-semibold border ${statusColor}">${item.status}</span>
                            </div>
                            <p class="text-xs text-slate-300 bg-slate-900/60 p-3 rounded-xl border border-slate-800/50">${item.notes || 'Sem observações adicionais.'}</p>
                            <div class="flex items-center justify-between pt-1 text-[11px] text-slate-500">
                                <span>Registrado em: ${item.date}</span>
                                <div class="flex items-center space-x-2">
                                    <button onclick="App.editItem('${item.id}')" class="p-1.5 rounded-lg bg-slate-900 hover:text-cyan-400 text-slate-400 transition-colors">
                                        <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <button onclick="App.deleteItem('${item.id}')" class="p-1.5 rounded-lg bg-slate-900 hover:text-red-400 text-slate-400 transition-colors">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                lucide.createIcons();
            },
            openModal(id = null) {
                document.getElementById('item-modal').classList.remove('hidden');
                if (id) {
                    const item = State.items.find(i => i.id === id);
                    if (item) {
                        document.getElementById('modal-title').innerText = 'Editar Registro';
                        document.getElementById('item-id').value = item.id;
                        document.getElementById('item-title').value = item.title;
                        document.getElementById('item-sector').value = item.sector;
                        document.getElementById('item-status').value = item.status;
                        document.getElementById('item-notes').value = item.notes;
                    }
                } else {
                    document.getElementById('modal-title').innerText = 'Novo Registro de Ativo';
                    document.getElementById('inspection-form').reset();
                    document.getElementById('item-id').value = '';
                }
            },
            closeModal() {
                document.getElementById('item-modal').classList.add('hidden');
            },
            saveItem(e) {
                e.preventDefault();
                const id = document.getElementById('item-id').value;
                const title = document.getElementById('item-title').value;
                const sector = document.getElementById('item-sector').value;
                const status = document.getElementById('item-status').value;
                const notes = document.getElementById('item-notes').value;
                const date = new Date().toLocaleDateString('pt-BR');

                if (id) {
                    State.items = State.items.map(i => i.id === id ? { ...i, title, sector, status, notes } : i);
                } else {
                    const newItem = { id: Date.now().toString(), title, sector, status, notes, date };
                    State.items.unshift(newItem);
                }

                localStorage.setItem('nexus_items', JSON.stringify(State.items));
                this.closeModal();
                this.renderItems();
            },
            editItem(id) {
                this.openModal(id);
            },
            deleteItem(id) {
                if (confirm('Deseja realmente excluir este registro permanentemente?')) {
                    State.items = State.items.filter(i => i.id !== id);
                    localStorage.setItem('nexus_items', JSON.stringify(State.items));
                    this.renderItems();
                }
            },
            exportDataJSON() {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(State.items, null, 2));
                const dlAnchor = document.createElement('a');
                dlAnchor.setAttribute("href", dataStr);
                dlAnchor.setAttribute("download", `nexus_backup_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(dlAnchor);
                dlAnchor.click();
                dlAnchor.remove();
            },
            generatePDFReport() {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                doc.setFillColor(15, 23, 42);
                doc.rect(0, 0, 210, 297, 'F');

                doc.setTextColor(6, 182, 212);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(22);
                doc.text("Relatório Técnico de Inspeção", 20, 25);

                doc.setTextColor(148, 163, 184);
                doc.setFontSize(10);
                doc.text(`Gerado em: ${new Date().toLocaleString('pt-BR')} | Nexus Core v5`, 20, 33);
                doc.text(`Distância Registrada na Sessão: ${document.getElementById('metric-distance').innerText} km`, 20, 40);

                let y = 55;
                State.items.forEach((item, index) => {
                    if (y > 260) {
                        doc.addPage();
                        doc.setFillColor(15, 23, 42);
                        doc.rect(0, 0, 210, 297, 'F');
                        y = 25;
                    }

                    doc.setTextColor(255, 255, 255);
                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(12);
                    doc.text(`${index + 1}. ${item.title} (${item.sector})`, 20, y);

                    doc.setTextColor(148, 163, 184);
                    doc.setFont("helvetica", "normal");
                    doc.setFontSize(10);
                    doc.text(`Status: ${item.status} | Data: ${item.date}`, 20, y + 6);
                    doc.text(`Obs: ${item.notes || 'N/A'}`, 20, y + 12);

                    doc.setDrawColor(51, 65, 85);
                    doc.line(20, y + 18, 190, y + 18);
                    y += 26;
                });

                doc.save(`relatorio_inspecao_${new Date().toISOString().slice(0,10)}.pdf`);
            },
            toggleTheme() {
                document.documentElement.classList.toggle('dark');
            },
            switchTab(tab) {
                // Navegação fluida entre abas caso necessário
            }
        };

        window.onload = () => App.init();
    </script>
</body>
</html>
