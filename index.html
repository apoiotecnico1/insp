<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    >
    <meta name="theme-color" content="#070909">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Sistema Integrado de Apoio e Inspeção - Nox OS</title>

    <script src="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js)"></script>

    <style>
        :root {
            --bg: #070909;
            --bg-soft: #0c0f0f;
            --surface: #111515;
            --surface-2: #171c1c;
            --surface-3: #1e2424;
            --border: rgba(255, 255, 255, 0.09);
            --border-strong: rgba(255, 255, 255, 0.18);
            --accent: #ffd600;
            --accent-2: #ffb800;
            --accent-soft: rgba(255, 214, 0, 0.12);
            --green: #00e676;
            --green-dark: #008f55;
            --green-soft: rgba(0, 230, 118, 0.1);
            --bad: #ff3158;
            --bad-soft: rgba(255, 49, 88, 0.1);
            --warn: #ff9f1a;
            --warn-soft: rgba(255, 159, 26, 0.1);
            --text: #ffffff;
            --text-soft: #c4cccc;
            --text-muted: #818b8b;
            --glass: rgba(10, 13, 13, 0.92);
            --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
            --shadow-soft: 0 8px 26px rgba(0, 0, 0, 0.28);
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --header-height: 72px;
            --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;
            background: var(--bg);
            color-scheme: dark;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 50% -15%, rgba(255, 214, 0, 0.1), transparent 35%),
                linear-gradient(180deg, #090b0b, var(--bg));
            color: var(--text);
            font-family: var(--font);
            font-synthesis: none;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button,
        select,
        input[type="checkbox"] {
            touch-action: manipulation;
        }

        button {
            -webkit-user-select: none;
            user-select: none;
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 3px solid rgba(255, 214, 0, 0.35);
            outline-offset: 2px;
        }

        .hidden {
            display: none !important;
        }

        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        .eyebrow {
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .app-module {
            display: none;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .app-module.active {
            display: block;
        }

        /* MENU */

        #main-menu {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            overflow-y: auto;
            background:
                radial-gradient(circle at 50% 8%, rgba(255, 214, 0, 0.16), transparent 30%),
                radial-gradient(circle at 95% 90%, rgba(0, 230, 118, 0.08), transparent 30%),
                var(--bg);
        }

        .menu-shell {
            width: min(100%, 480px);
            min-height: 100%;
            margin: auto;
            padding:
                max(28px, env(safe-area-inset-top))
                20px
                max(28px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .brand-mark {
            position: relative;
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 214, 0, 0.36);
            border-radius: 18px;
            background:
                linear-gradient(145deg, rgba(255, 214, 0, 0.22), rgba(255, 214, 0, 0.04)),
                var(--surface);
            box-shadow:
                0 12px 36px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .brand-mark::after {
            content: "";
            position: absolute;
            inset: 6px;
            border: 1px solid rgba(255, 214, 0, 0.18);
            border-radius: 13px;
        }

        .brand-mark span {
            color: var(--accent);
            font-size: 1.25rem;
            font-weight: 1000;
            letter-spacing: -0.06em;
        }

        .brand-copy {
            text-align: left;
        }

        .brand-name {
            font-size: 1.55rem;
            font-weight: 1000;
            letter-spacing: -0.045em;
            line-height: 1;
        }

        .brand-version {
            margin-top: 7px;
            color: var(--text-muted);
            font-size: 0.68rem;
            font-weight: 850;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .menu-copy {
            margin: 14px auto 28px;
            max-width: 360px;
            text-align: center;
        }

        .menu-title {
            font-size: clamp(1.75rem, 8vw, 2.4rem);
            font-weight: 1000;
            letter-spacing: -0.055em;
            line-height: 1.02;
        }

        .menu-title strong {
            color: var(--accent);
        }

        .menu-subtitle {
            margin-top: 12px;
            color: var(--text-soft);
            font-size: 0.92rem;
            line-height: 1.55;
        }

        .menu-buttons {
            display: grid;
            gap: 12px;
            width: 100%;
        }

        .btn-menu {
            position: relative;
            min-height: 82px;
            padding: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.035), transparent),
                var(--surface);
            color: var(--text);
            cursor: pointer;
            box-shadow: var(--shadow-soft);
            text-align: left;
            transition:
                transform 0.16s ease,
                border-color 0.16s ease,
                background 0.16s ease;
        }

        .btn-menu::after {
            content: "›";
            position: absolute;
            top: 50%;
            right: 18px;
            color: var(--text-muted);
            font-size: 1.85rem;
            font-weight: 400;
            transform: translateY(-54%);
        }

        .btn-menu-content {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-right: 24px;
        }

        .btn-menu-icon {
            width: 48px;
            height: 48px;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: var(--surface-3);
            font-size: 1.4rem;
        }

        .btn-menu-text {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 5px;
        }

        .btn-menu-title {
            font-size: 0.96rem;
            font-weight: 950;
            letter-spacing: 0.025em;
            text-transform: uppercase;
        }

        .btn-menu-subtitle {
            color: var(--text-muted);
            font-size: 0.76rem;
            font-weight: 650;
            line-height: 1.35;
        }

        .btn-menu-primary {
            border-color: rgba(255, 214, 0, 0.5);
            background:
                linear-gradient(145deg, rgba(255, 214, 0, 0.18), rgba(255, 214, 0, 0.035)),
                var(--surface);
        }

        .btn-menu-primary .btn-menu-icon {
            border-color: rgba(255, 214, 0, 0.4);
            background: var(--accent);
            color: #000;
            box-shadow: 0 8px 24px rgba(255, 214, 0, 0.18);
        }

        .btn-menu-primary::after {
            color: var(--accent);
        }

        .menu-footer {
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 0.66rem;
            font-weight: 800;
            letter-spacing: 0.13em;
            text-align: center;
            text-transform: uppercase;
        }

        @media (hover: hover) {
            .btn-menu:hover {
                border-color: var(--border-strong);
                background: var(--surface-2);
                transform: translateY(-2px);
            }
        }

        .btn-menu:active {
            transform: scale(0.98);
        }

        /* CABEÇALHO DOS MÓDULOS */

        .module-header {
            position: sticky;
            top: 0;
            z-index: 800;
            min-height: calc(var(--header-height) + env(safe-area-inset-top));
            padding:
                calc(10px + env(safe-area-inset-top))
                14px
                10px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            background: rgba(7, 9, 9, 0.88);
            -webkit-backdrop-filter: blur(22px);
            backdrop-filter: blur(22px);
        }

        .header-back {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 1.25rem;
        }

        .header-copy {
            min-width: 0;
            flex: 1;
        }

        .header-title {
            overflow: hidden;
            font-size: 0.96rem;
            font-weight: 950;
            letter-spacing: 0.03em;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .header-subtitle {
            margin-top: 3px;
            overflow: hidden;
            color: var(--text-muted);
            font-size: 0.69rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 10px;
            border: 1px solid rgba(0, 230, 118, 0.2);
            border-radius: 100px;
            background: rgba(0, 230, 118, 0.06);
            color: var(--green);
            font-size: 0.62rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .header-status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 10px currentColor;
        }

        /* ELEMENTOS COMPARTILHADOS */

        .module-content {
            width: min(100%, 640px);
            margin: 0 auto;
            padding:
                16px
                14px
                calc(28px + env(safe-area-inset-bottom));
        }

        .panel {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.025), transparent),
                var(--surface);
            box-shadow: var(--shadow-soft);
        }

        .panel + .panel {
            margin-top: 12px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .panel-title {
            color: var(--text-soft);
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }

        .panel-hint {
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 700;
        }

        .btn-action {
            width: 100%;
            min-height: 52px;
            padding: 12px 16px;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--green), #00c968);
            color: #00160b;
            cursor: pointer;
            font-size: 0.86rem;
            font-weight: 950;
            letter-spacing: 0.055em;
            text-transform: uppercase;
            box-shadow: 0 8px 22px rgba(0, 230, 118, 0.16);
            transition:
                opacity 0.16s,
                transform 0.16s;
        }

        .btn-action:active {
            transform: scale(0.985);
        }

        .btn-action:disabled {
            background: var(--surface-3);
            color: #596161;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-secondary {
            border: 1px solid var(--border-strong);
            background: var(--surface-2);
            color: var(--text);
            box-shadow: none;
        }

        .status-box {
            min-height: 48px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface);
            font-size: 0.74rem;
            font-weight: 900;
            letter-spacing: 0.055em;
            text-align: center;
            text-transform: uppercase;
        }

        .status-box::before {
            content: "";
            width: 8px;
            height: 8px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 10px currentColor;
        }

        .status-box.ok {
            border-color: rgba(0, 230, 118, 0.35);
            background: var(--green-soft);
            color: var(--green);
        }

        .status-box.warn {
            border-color: rgba(255, 159, 26, 0.35);
            background: var(--warn-soft);
            color: var(--warn);
        }

        .status-box.bad {
            border-color: rgba(255, 49, 88, 0.32);
            background: var(--bad-soft);
            color: var(--bad);
        }

        select,
        input[type="text"],
        input[type="number"] {
            min-height: 48px;
            border: 1px solid var(--border-strong);
            border-radius: 12px;
            background: var(--surface-2);
            color: var(--text);
            outline: none;
        }

        select:focus,
        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            flex: 0 0 auto;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* APOIO */

        #mod-apoio {
            background:
                radial-gradient(circle at 50% 0, rgba(255, 214, 0, 0.055), transparent 30%),
                var(--bg);
        }

        .target-lock-banner {
            display: none;
            margin-bottom: 12px;
            padding: 16px;
            border: 2px solid rgba(255, 255, 255, 0.82);
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, #00b95e, #007d40);
            color: #fff;
            box-shadow:
                0 14px 35px rgba(0, 196, 100, 0.26),
                inset 0 1px 0 rgba(255, 255, 255, 0.24);
            text-align: center;
        }

        .target-lock-banner.active {
            display: block;
            animation: targetPulse 1.5s infinite;
        }

        @keyframes targetPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 14px 35px rgba(0, 196, 100, 0.22);
            }
            50% {
                transform: scale(1.012);
                box-shadow: 0 16px 42px rgba(0, 196, 100, 0.42);
            }
        }

        .target-lock-icon {
            margin-bottom: 5px;
            font-size: 1.45rem;
        }

        .target-lock-title {
            font-size: 1rem;
            font-weight: 1000;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .target-lock-sub {
            margin-top: 5px;
            font-size: 0.7rem;
            font-weight: 850;
            opacity: 0.9;
        }

        .search-id-box {
            padding: 15px;
            border-color: rgba(255, 214, 0, 0.35);
            background:
                linear-gradient(145deg, rgba(255, 214, 0, 0.055), transparent),
                var(--surface);
        }

        .search-id-input-group {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 8px;
        }

        .search-id-input-group input {
            width: 100%;
            min-width: 0;
            padding: 0 13px;
            font-size: 16px;
            font-weight: 850;
            text-transform: uppercase;
        }

        .search-id-input-group button {
            min-width: 50px;
            min-height: 48px;
            padding: 0 13px;
            border: 0;
            border-radius: 12px;
            background: var(--accent);
            color: #070707;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 950;
            text-transform: uppercase;
        }

        .search-id-input-group .clear-button {
            border: 1px solid var(--border);
            background: var(--surface-3);
            color: var(--text-soft);
        }

        #searchResultArea {
            margin-top: 10px;
        }

        .search-message {
            padding: 11px;
            border-radius: 11px;
            font-size: 0.72rem;
            font-weight: 900;
            line-height: 1.45;
            text-align: center;
            text-transform: uppercase;
        }

        .search-message.warning {
            background: var(--warn-soft);
            color: var(--warn);
        }

        .search-message.error {
            background: var(--bad-soft);
            color: var(--bad);
        }

        .search-result-card {
            padding: 12px;
            border: 1px solid rgba(255, 214, 0, 0.34);
            border-radius: 14px;
            background: rgba(255, 214, 0, 0.045);
        }

        .result-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .result-id {
            color: var(--accent);
            font-size: 0.86rem;
            font-weight: 950;
            line-height: 1.35;
        }

        .result-distance {
            flex: 0 0 auto;
            color: var(--accent);
            font-size: 0.68rem;
            font-weight: 900;
            line-height: 1.35;
            text-align: right;
        }

        .coordinates {
            margin-bottom: 10px;
            color: var(--text-muted);
            font-size: 0.66rem;
            font-weight: 750;
            word-break: break-word;
        }

        .km-card {
            position: relative;
            margin-top: 12px;
            overflow: hidden;
            padding: 22px 18px;
            border: 1px solid rgba(0, 230, 118, 0.34);
            border-radius: var(--radius-xl);
            background:
                radial-gradient(circle at 50% 0, rgba(255, 255, 255, 0.15), transparent 43%),
                linear-gradient(135deg, #008a58, #005f3e);
            box-shadow:
                0 16px 38px rgba(0, 117, 74, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.22);
            text-align: center;
        }

        .km-card::before,
        .km-card::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 7px;
            height: 7px;
            border: 1px solid rgba(255, 255, 255, 0.38);
            border-radius: 50%;
            transform: translateY(-50%);
        }

        .km-card::before {
            left: 12px;
        }

        .km-card::after {
            right: 12px;
        }

        .km-label {
            color: rgba(255, 255, 255, 0.86);
            font-size: 0.68rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .km-value {
            display: block;
            margin-top: 7px;
            color: #fff;
            font-size: clamp(2.6rem, 14vw, 4rem);
            font-weight: 1000;
            letter-spacing: -0.055em;
            line-height: 0.95;
            font-variant-numeric: tabular-nums;
        }

        .km-unit {
            margin-top: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.66rem;
            font-weight: 800;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }

        #gpsStatus {
            margin-top: 12px;
        }

        .controls-panel {
            margin-top: 12px;
            padding: 14px;
        }

        .controls {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: end;
            margin-top: 12px;
        }

        .field {
            min-width: 0;
        }

        .field-label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .field select {
            width: 100%;
            padding: 0 12px;
            font-size: 0.88rem;
            font-weight: 850;
        }

        .maps-toggle {
            min-height: 48px;
            padding: 0 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-2);
            color: var(--text-soft);
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .list-section {
            margin-top: 18px;
        }

        .list-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 0 2px 10px;
        }

        .list-section-title {
            font-size: 0.72rem;
            font-weight: 950;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }

        .list-section-badge {
            padding: 6px 9px;
            border: 1px solid var(--border);
            border-radius: 100px;
            background: var(--surface);
            color: var(--text-muted);
            font-size: 0.6rem;
            font-weight: 850;
            text-transform: uppercase;
        }

        ul.apoio-list {
            display: grid;
            gap: 10px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        ul.apoio-list li {
            overflow: hidden;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.02), transparent),
                var(--surface);
            box-shadow: var(--shadow-soft);
        }

        ul.apoio-list li.nearest {
            border-color: rgba(255, 214, 0, 0.62);
            background:
                linear-gradient(145deg, rgba(255, 214, 0, 0.09), transparent),
                var(--surface);
            box-shadow:
                0 12px 28px rgba(255, 214, 0, 0.08),
                inset 0 0 0 1px rgba(255, 214, 0, 0.06);
        }

        .nearest-tag {
            display: inline-flex;
            margin-bottom: 9px;
            padding: 5px 8px;
            border-radius: 100px;
            background: var(--accent);
            color: #090909;
            font-size: 0.57rem;
            font-weight: 1000;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .item-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .item-left {
            display: flex;
            min-width: 0;
            align-items: flex-start;
            gap: 10px;
        }

        .item-copy {
            min-width: 0;
        }

        .id-val {
            display: block;
            overflow-wrap: anywhere;
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 950;
            letter-spacing: 0.015em;
        }

        .item-type {
            display: block;
            margin-top: 4px;
            color: var(--text-muted);
            font-size: 0.58rem;
            font-weight: 750;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .dist-val {
            flex: 0 0 auto;
            max-width: 44%;
            color: var(--accent);
            font-size: 0.66rem;
            font-weight: 900;
            line-height: 1.4;
            text-align: right;
        }

        .mini-map {
            position: relative;
            width: 100%;
            height: 150px;
            margin-top: 11px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 13px;
            background:
                linear-gradient(110deg, #161a1a 8%, #202626 18%, #161a1a 33%);
            background-size: 200% 100%;
        }

        .mini-map iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .skeleton {
            height: 86px;
            background:
                linear-gradient(
                    100deg,
                    rgba(255, 255, 255, 0.02) 20%,
                    rgba(255, 255, 255, 0.065) 40%,
                    rgba(255, 255, 255, 0.02) 60%
                ),
                var(--surface) !important;
            background-size: 200% 100% !important;
            animation: skeletonMove 1.4s infinite linear;
        }

        @keyframes skeletonMove {
            to {
                background-position-x: -200%;
            }
        }

        .module-footer-button {
            margin-top: 16px;
        }

        /* INSPEÇÃO */

        #mod-inspecao {
            position: fixed;
            inset: 0;
            z-index: 9500;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #000;
        }

        #safety-gate {
            position: absolute;
            inset: 0;
            z-index: 1500;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding:
                max(24px, env(safe-area-inset-top))
                18px
                max(24px, env(safe-area-inset-bottom));
            background:
                radial-gradient(circle at 50% 15%, rgba(255, 214, 0, 0.14), transparent 32%),
                #050606;
        }

        .alert-box {
            width: min(100%, 420px);
            padding: 26px 20px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-xl);
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.035), transparent),
                var(--surface);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .alert-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 17px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 214, 0, 0.34);
            border-radius: 21px;
            background: var(--accent-soft);
            font-size: 1.85rem;
        }

        .alert-box h2 {
            color: var(--text);
            font-size: 1.3rem;
            font-weight: 1000;
            letter-spacing: -0.025em;
            text-transform: uppercase;
        }

        .alert-box h2 span {
            color: var(--accent);
        }

        .alert-box p {
            max-width: 320px;
            margin: 10px auto 0;
            color: var(--text-soft);
            font-size: 0.82rem;
            font-weight: 650;
            line-height: 1.55;
        }

        .safety-list {
            display: grid;
            gap: 8px;
            margin: 20px 0;
            text-align: left;
        }

        .safety-item {
            padding: 10px 11px;
            display: flex;
            align-items: center;
            gap: 9px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-2);
            color: var(--text-soft);
            font-size: 0.69rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .safety-check {
            width: 22px;
            height: 22px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            border-radius: 8px;
            background: var(--green-soft);
            color: var(--green);
            font-size: 0.7rem;
        }

        .btn-aware {
            width: 100%;
            min-height: 56px;
            border: 0;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #060606;
            cursor: pointer;
            font-size: 0.84rem;
            font-weight: 1000;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            box-shadow: 0 10px 28px rgba(255, 214, 0, 0.2);
        }

        .gate-back {
            margin-top: 10px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            box-shadow: none;
        }

        #app-shell {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            visibility: hidden;
            background: #000;
        }

        #vid {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: crosshair;
            touch-action: manipulation;
        }

        .camera-shade-top,
        .camera-shade-bottom {
            position: absolute;
            right: 0;
            left: 0;
            z-index: 20;
            pointer-events: none;
        }

        .camera-shade-top {
            top: 0;
            height: 160px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.68), transparent);
        }

        .camera-shade-bottom {
            bottom: 0;
            height: 220px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.78), transparent);
        }

        #km-hud {
            position: absolute;
            top: calc(18px + env(safe-area-inset-top));
            left: 14px;
            z-index: 100;
            min-width: 154px;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.82);
            border-radius: 15px;
            background: rgba(0, 111, 65, 0.86);
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            text-align: center;
            transition: transform 0.15s ease;
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            pointer-events: none;
        }

        .hud-pulse {
            border-color: var(--accent) !important;
            transform: scale(1.055);
        }

        #br-txt {
            width: 100%;
            min-height: 12px;
            padding-bottom: 3px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            color: rgba(255, 255, 255, 0.78);
            font-size: 0.58rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        #km-txt {
            margin-top: 4px;
            font-size: clamp(1.65rem, 8vw, 2.35rem);
            font-weight: 1000;
            letter-spacing: -0.045em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        #rec-tag {
            position: absolute;
            top: calc(24px + env(safe-area-inset-top));
            right: 14px;
            z-index: 100;
            max-width: 42vw;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 7px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 100px;
            background: rgba(0, 0, 0, 0.66);
            opacity: 0;
            pointer-events: none;
            -webkit-backdrop-filter: blur(9px);
            backdrop-filter: blur(9px);
        }

        #rec-tag span {
            overflow: hidden;
            color: #fff;
            font-size: 0.56rem;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .dot {
            width: 9px;
            height: 9px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: var(--bad);
            box-shadow: 0 0 10px var(--bad);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.2;
            }
        }

        .camera-tip {
            position: absolute;
            bottom: calc(118px + env(safe-area-inset-bottom));
            left: 50%;
            z-index: 90;
            padding: 7px 11px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 100px;
            background: rgba(0, 0, 0, 0.55);
            color: rgba(255, 255, 255, 0.76);
            font-size: 0.57rem;
            font-weight: 850;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transform: translateX(-50%);
            transition: opacity 0.3s ease;
            white-space: nowrap;
            pointer-events: none;
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
        }

        #ui-controls {
            position: absolute;
            right: 12px;
            bottom: calc(18px + env(safe-area-inset-bottom));
            left: 12px;
            z-index: 500;
            width: min(calc(100% - 24px), 460px);
            min-height: 70px;
            margin: 0 auto;
            padding: 9px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 21px;
            background: rgba(9, 11, 11, 0.76);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            transition:
                opacity 0.3s ease,
                visibility 0.3s ease,
                transform 0.3s ease;
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
        }

        #ui-controls.ui-hidden {
            visibility: hidden;
            opacity: 0;
            transform: translateY(18px);
        }

        .camera-icon-button {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .btn-main {
            min-width: 0;
            min-height: 52px;
            padding: 0 14px;
            flex: 1;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.76rem;
            font-weight: 1000;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        #btn-start {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #000;
        }

        #btn-stop {
            display: none;
            background: linear-gradient(135deg, var(--bad), #d50036);
            color: #fff;
        }

        #settings-backdrop {
            position: fixed;
            inset: 0;
            z-index: 3900;
            visibility: hidden;
            background: rgba(0, 0, 0, 0.56);
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #settings-backdrop.open {
            visibility: visible;
            opacity: 1;
        }

        #settings-panel {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 4000;
            width: min(88vw, 360px);
            height: 100vh;
            height: 100dvh;
            padding:
                calc(22px + env(safe-area-inset-top))
                18px
                calc(24px + env(safe-area-inset-bottom));
            overflow-y: auto;
            border-left: 1px solid var(--border);
            background: var(--glass);
            box-shadow: -16px 0 45px rgba(0, 0, 0, 0.56);
            transform: translateX(105%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-backdrop-filter: blur(26px);
            backdrop-filter: blur(26px);
        }

        #settings-panel.open {
            transform: translateX(0);
        }

        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 22px;
        }

        .settings-title {
            font-size: 1rem;
            font-weight: 1000;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .settings-close {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: var(--surface-2);
            color: var(--text);
            cursor: pointer;
            font-size: 1rem;
        }

        #settings-panel label {
            display: block;
            margin: 17px 0 7px;
            color: var(--accent);
            font-size: 0.68rem;
            font-weight: 900;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }

        #settings-panel input,
        #settings-panel select {
            width: 100%;
            padding: 0 12px;
            font-size: 16px;
            font-weight: 800;
        }

        .settings-note {
            margin-top: 20px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: var(--surface-2);
            color: var(--text-muted);
            font-size: 0.68rem;
            font-weight: 650;
            line-height: 1.55;
        }

        canvas#c {
            display: none;
        }

        #flash {
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.06s ease-out;
        }

        /* KM EM TEMPO REAL */

        #mod-km-realtime {
            background:
                radial-gradient(circle at 50% 0, rgba(0, 230, 118, 0.07), transparent 34%),
                var(--bg);
        }

        .realtime-content {
            width: min(100%, 600px);
            margin: 0 auto;
            padding:
                20px
                14px
                calc(30px + env(safe-area-inset-bottom));
        }

        .realtime-hero {
            padding: 22px 16px;
            text-align: center;
        }

        .realtime-title {
            margin-top: 8px;
            font-size: clamp(1.25rem, 6vw, 1.8rem);
            font-weight: 1000;
            letter-spacing: -0.035em;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .realtime-description {
            max-width: 360px;
            margin: 10px auto 0;
            color: var(--text-muted);
            font-size: 0.78rem;
            line-height: 1.55;
        }

        .realtime-km-card {
            margin-top: 18px;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .realtime-pulse {
            width: 54px;
            height: 54px;
            margin-bottom: 15px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            font-size: 1.3rem;
            animation: gpsPulse 2.4s infinite;
        }

        @keyframes gpsPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.12);
            }
            50% {
                box-shadow: 0 0 0 15px rgba(255, 255, 255, 0);
            }
        }

        #realtimeGpsStatus {
            margin-top: 12px;
        }

        /* NOTIFICAÇÕES */

        #toast-container {
            position: fixed;
            right: 14px;
            bottom: calc(16px + env(safe-area-inset-bottom));
            left: 14px;
            z-index: 20000;
            display: grid;
            justify-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            width: min(100%, 420px);
            padding: 12px 14px;
            border: 1px solid var(--border-strong);
            border-radius: 14px;
            background: rgba(20, 24, 24, 0.96);
            color: var(--text);
            box-shadow: var(--shadow);
            font-size: 0.74rem;
            font-weight: 800;
            line-height: 1.4;
            text-align: center;
            animation: toastIn 0.25s ease both;
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
        }

        .toast.error {
            border-color: rgba(255, 49, 88, 0.4);
            color: #ff9aae;
        }

        .toast.success {
            border-color: rgba(0, 230, 118, 0.4);
            color: #76f4b5;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
        }

        @media (max-width: 390px) {
            .header-status {
                display: none;
            }

            .search-id-input-group {
                grid-template-columns: minmax(0, 1fr) 50px 50px;
            }

            .search-id-input-group button {
                padding: 0 8px;
                font-size: 0;
            }

            .search-id-input-group button::before {
                content: "⌕";
                font-size: 1.25rem;
            }

            .search-id-input-group .clear-button::before {
                content: "×";
                font-size: 1.3rem;
            }

            .item-header,
            .result-top {
                flex-direction: column;
            }

            .dist-val,
            .result-distance {
                max-width: 100%;
                padding-left: 32px;
                text-align: left;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .maps-toggle {
                justify-content: center;
            }

            #km-hud {
                min-width: 136px;
                padding: 9px 12px;
            }

            #rec-tag span {
                display: none;
            }

            #rec-tag {
                width: 34px;
                height: 34px;
                justify-content: center;
                padding: 0;
            }

            .camera-icon-button {
                width: 48px;
                height: 48px;
            }

            #ui-controls {
                padding: 8px;
            }
        }

        @media (min-width: 700px) {
            .menu-shell {
                width: min(100%, 760px);
            }

            .menu-buttons {
                grid-template-columns: repeat(3, 1fr);
            }

            .btn-menu {
                min-height: 190px;
            }

            .btn-menu::after {
                top: auto;
                right: 18px;
                bottom: 14px;
                transform: none;
            }

            .btn-menu-content {
                height: 100%;
                align-items: flex-start;
                flex-direction: column;
            }

            .btn-menu-icon {
                width: 56px;
                height: 56px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main id="main-menu" aria-label="Menu principal">
        <div class="menu-shell">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <span>NX</span>
                </div>

                <div class="brand-copy">
                    <div class="brand-name">NOX OS</div>
                    <div class="brand-version">Sistema integrado de campo</div>
                </div>
            </div>

            <div class="menu-copy">
                <div class="eyebrow">Central operacional</div>
                <h1 class="menu-title">
                    Sistema de <strong>apoio</strong>
                </h1>
                <p class="menu-subtitle">
                    Localização, inspeção fotográfica e monitoramento de
                    quilometragem em uma única interface.
                </p>
            </div>

            <div class="menu-buttons">
                <button
                    class="btn-menu btn-menu-primary"
                    type="button"
                    onclick="openModule('apoio')"
                >
                    <span class="btn-menu-content">
                        <span class="btn-menu-icon icon" aria-hidden="true">⌖</span>
                        <span class="btn-menu-text">
                            <span class="btn-menu-title">Apoio Localização</span>
                            <span class="btn-menu-subtitle">
                                Encontre postes e IDs próximos à sua posição.
                            </span>
                        </span>
                    </span>
                </button>

                <button
                    class="btn-menu"
                    type="button"
                    onclick="openModule('inspecao')"
                >
                    <span class="btn-menu-content">
                        <span class="btn-menu-icon icon" aria-hidden="true">▣</span>
                        <span class="btn-menu-text">
                            <span class="btn-menu-title">Inspeção Fotográfica</span>
                            <span class="btn-menu-subtitle">
                                Capture imagens manuais e relatórios automáticos.
                            </span>
                        </span>
                    </span>
                </button>

                <button
                    class="btn-menu"
                    type="button"
                    onclick="openModule('km-realtime')"
                >
                    <span class="btn-menu-content">
                        <span class="btn-menu-icon icon" aria-hidden="true">◇</span>
                        <span class="btn-menu-text">
                            <span class="btn-menu-title">KM em Tempo Real</span>
                            <span class="btn-menu-subtitle">

                            </span>
                        </span>
                    </span>
                </button>
            </div>

            <div class="menu-footer">
                GPS e câmera podem exigir conexão HTTPS
            </div>
        </div>
    </main>

    <!-- MÓDULO 1: APOIO LOCALIZAÇÃO -->

    <section id="mod-apoio" class="app-module" aria-label="Apoio localização">
        <header class="module-header">
            <button
                class="header-back"
                type="button"
                onclick="openModule('menu')"
                aria-label="Voltar ao menu"
            >
                ←
            </button>

            <div class="header-copy">
                <div class="header-title">Apoio Localização</div>
                <div class="header-subtitle">Busca de postes e ordens de serviço</div>
            </div>

            <div class="header-status">
                <span class="header-status-dot"></span>
                Campo
            </div>
        </header>

        <div class="module-content">
            <div id="targetLockBanner" class="target-lock-banner">
                <div class="target-lock-icon" aria-hidden="true">◎</div>
                <div class="target-lock-title
