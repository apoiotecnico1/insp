<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Amostras e Registros</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f6f7;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #dcdde1;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
        }
        .container {
            max-width: 1100px;
            margin: auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #fdfefe;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        select, input[type="text"] {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        input[type="text"] {
            min-width: 250px;
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.btn-danger {
            background-color: #e74c3c;
        }
        button.btn-danger:hover {
            background-color: #c0392b;
        }
        .form-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            align-items: center;
        }
        @media(max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 10px 12px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: var(--primary);
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .status-bar {
            margin-top: 15px;
            font-size: 13px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Gerenciador de Amostra e Registros (Offline)</h2>

    <!-- Formulário de Inclusão -->
    <div class="form-section">
        <strong>Novo Registro</strong>
        <div class="form-row" style="margin-top: 10px;">
            <input type="text" id="descricaoItem" placeholder="Descrição ou observação do item...">
            <input type="text" id="categoriaItem" placeholder="Categoria / Setor">
            <input type="text" id="fotoRef" placeholder="Ref. Foto / Anexo (Opcional)">
            <button onclick="adicionarRegistro()">Adicionar</button>
        </div>
    </div>

    <!-- Barra de Ferramentas (Pesquisa e Tamanho da Amostra) -->
    <div class="toolbar">
        <div class="control-group">
            <label for="limiteAmostra"><strong>Tamanho da Amostra:</strong></label>
            <select id="limiteAmostra" onchange="carregarDados()">
                <option value="20">20</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
            </select>
        </div>

        <div class="control-group">
            <label for="campoPesquisa"><strong>Pesquisa:</strong></label>
            <input type="text" id="campoPesquisa" oninput="carregarDados()" placeholder="Filtrar por texto...">
        </div>

        <div class="control-group">
            <button class="btn-danger" onclick="limparDadosLocalStorage()">Limpar Dados</button>
        </div>
    </div>

    <!-- Tabela de Dados -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Descrição</th>
                <th>Categoria</th>
                <th>Anexo / Foto</th>
                <th>Data / Hora</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="corpoTabela">
            <!-- Preenchido via JavaScript -->
        </tbody>
    </table>

    <div class="status-bar">
        <span id="contadorExibidos">Exibindo 0 de 0 registros</span>
        <span>Armazenamento Local Ativo</span>
    </div>
</div>

<script>
    const CHAVE_STORAGE = "app_dados_amostra_v1";

    // Inicializa com alguns dados de exemplo caso o armazenamento esteja vazio
    function inicializarStoragePadrao() {
        if (!localStorage.getItem(CHAVE_STORAGE)) {
            let dadosIniciais = [];
            for (let i = 1; i <= 60; i++) {
                dadosIniciais.push({
                    id: i,
                    descricao: `Registro de monitoramento operacional #${i}`,
                    categoria: i % 2 === 0 ? "Manutenção" : "Inspeção",
                    foto: `foto_${i}.jpg`,
                    data: new Date(Date.now() - i * 3600000).toLocaleString()
                });
            }
            localStorage.setItem(CHAVE_STORAGE, JSON.stringify(dadosIniciais));
        }
    }

    function obterDados() {
        const dados = localStorage.getItem(CHAVE_STORAGE);
        return dados ? JSON.parse(dados) : [];
    }

    function salvarDados(dados) {
        localStorage.setItem(CHAVE_STORAGE, JSON.stringify(dados));
    }

    function adicionarRegistro() {
        const desc = document.getElementById('descricaoItem').value.trim();
        const cat = document.getElementById('categoriaItem').value.trim();
        const foto = document.getElementById('fotoRef').value.trim();

        if (!desc) {
            alert('Por favor, informe a descrição do item.');
            return;
        }

        let dados = obterDados();
        const novoId = dados.length > 0 ? Math.max(...dados.map(d => d.id)) + 1 : 1;

        dados.unshift({
            id: novoId,
            descricao: desc,
            categoria: cat || "Geral",
            foto: foto || "-",
            data: new Date().toLocaleString()
        });

        salvarDados(dados);

        // Limpa campos
        document.getElementById('descricaoItem').value = '';
        document.getElementById('categoriaItem').value = '';
        document.getElementById('fotoRef').value = '';

        carregarDados();
    }

    function excluirRegistro(id) {
        if (confirm('Deseja realmente excluir este registro?')) {
            let dados = obterDados();
            dados = dados.filter(d => d.id !== id);
            salvarDados(dados);
            carregarDados();
        }
    }

    function limparDadosLocalStorage() {
        if (confirm('Atenção: Todos os registros salvos localmente serão apagados. Deseja prosseguir?')) {
            localStorage.removeItem(CHAVE_STORAGE);
            inicializarStoragePadrao();
            carregarDados();
        }
    }

    function carregarDados() {
        const limiteSelect = document.getElementById('limiteAmostra');
        const limite = parseInt(limiteSelect.value, 10);
        const termoBusca = document.getElementById('campoPesquisa').value.toLowerCase().trim();
        const corpoTabela = document.getElementById('corpoTabela');

        let dados = obterDados();
        let totalTotal = dados.length;

        // Filtro por texto digitado
        if (termoBusca) {
            dados = dados.filter(d => 
                d.descricao.toLowerCase().includes(termoBusca) ||
                d.categoria.toLowerCase().includes(termoBusca) ||
                d.id.toString().includes(termoBusca)
            );
        }

        const totalFiltrado = dados.length;
        
        // Aplica o limite de amostra selecionado (20, 50 ou 100)
        dados = dados.slice(0, limite);

        corpoTabela.innerHTML = '';

        if (dados.length === 0) {
            corpoTabela.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #7f8c8d; padding: 20px;">Nenhum registro encontrado.</td></tr>`;
        } else {
            dados.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.descricao}</td>
                    <td>${item.categoria}</td>
                    <td>${item.foto}</td>
                    <td>${item.data}</td>
                    <td><button class="btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="excluirRegistro(${item.id})">Excluir</button></td>
                `;
                corpoTabela.appendChild(tr);
            });
        }

        document.getElementById('contadorExibidos').innerText = `Exibindo ${dados.length} de ${totalFiltrado} registros filtrados (Total geral: ${totalTotal})`;
    }

    // Inicialização ao carregar a página
    window.onload = function() {
        inicializarStoragePadrao();
        carregarDados();
    };
</script>

</body>
</html>
