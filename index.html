<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>km / gps - panorama</title>
<meta name="theme-color" content="#000000" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #000000;
    --card: #111111;
    --border: #333333;
    --yellow: #ffd600;
    --green: #00e676;
    --text: #ffffff;
    --bad: #ff1744;
    --warn: #ff9100;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.2;
    padding: 10px;
    text-transform: lowercase;
  }

  .km-box {
    background: #00875a;
    border: 3px solid #ffffff;
    border-radius: 8px;
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin-bottom: 10px;
  }

  .km-label { font-size: 1rem; font-weight: 900; color: #ffffff; }
  .km-value { font-size: 2.5rem; font-weight: 900; color: #ffffff; line-height: 1; }

  .status-box {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.85rem;
    font-weight: 800;
    text-align: center;
    margin-bottom: 10px;
  }

  .ok { color: var(--green); border-color: var(--green); }
  .warn { color: var(--warn); border-color: var(--warn); }
  .bad { color: var(--bad); border-color: var(--bad); }

  .card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
  }

  /* Panorama do Mapa de Satélite Geral */
  #panoramaMap {
    width: 100%;
    height: 220px;
    border-radius: 6px;
    border: 2px solid var(--border);
    background: #111;
  }

  button#btnSend {
    width: 100%;
    min-height: 40px;
    padding: 8px 12px;
    font-family: var(--font);
    font-size: 0.95rem;
    font-weight: 900;
    border: 0;
    border-radius: 6px;
    background: var(--green);
    color: #000000;
    cursor: pointer;
    text-transform: lowercase;
  }

  button#btnSend:disabled { background: #222222; color: #555555; }

  .controls { display: flex; gap: 12px; margin-top: 8px; align-items: center; }
  .controls label { display: flex; align-items: center; gap: 4px; font-size: 0.85rem; font-weight: 800; }

  select {
    padding: 4px 8px;
    font-family: var(--font);
    font-size: 0.9rem;
    font-weight: 900;
    border-radius: 4px;
    border: 1px solid #444444;
    background: #222222;
    color: #ffffff;
  }

  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  
  li {
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    background: #181818;
    font-weight: 800;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
  }

  li.nearest { background: #222000; border: 3px solid var(--yellow); }

  .item-header { display: flex; justify-content: space-between; align-items: center; }
  .id-val { font-size: 1rem; font-weight: 800; color: #ffffff; }
  .dist-val { color: var(--yellow); font-size: 0.95rem; font-weight: 800; }
  .click-hint { font-size: 0.75rem; color: #888; text-align: right; margin-top: 2px; }

  /* Mini Mapa Oculto/Expansível */
  .mini-map-box {
    display: none;
    width: 100%;
    height: 160px;
    border-radius: 4px;
    border: 1px solid #444444;
    margin-top: 6px;
    overflow: hidden;
  }

  .mini-map-box iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }

  .mini-map-box.open { display: block; }
</style>
</head>
<body>

<div class="km-box">
  <span class="km-label">km</span>
  <span id="kmValue" class="km-value">—</span>
</div>

<div id="gpsStatus" class="status-box bad">gps: aguardando...</div>

<!-- Panorama de Satélite Geral -->
<div class="card">
  <div id="panoramaMap"></div>
</div>

<div class="card">
  <button id="btnSend" disabled>whatsapp</button>
  <div class="controls">
    <label>
      qtd:
      <select id="qty">
        <option value="1">1</option>
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="20">20</option>
      </select>
    </label>
  </div>
</div>

<div class="card">
  <ul id="list"></ul>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let dataset = [], kmDataset = [], lastPos = null;
let panoramaMap = null, markersLayer = null, userMarker = null;

const gpsStatus = document.getElementById('gpsStatus');
const btnSend = document.getElementById('btnSend');
const qtySel = document.getElementById('qty');
const listEl = document.getElementById('list');
const kmValue = document.getElementById('kmValue');

function normalizeStr(s){ return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9_ ]+/g,' ').replace(/\s+/g,' '); }
function findColumnIndex(headers, candidates){ const map=headers.map(h=>normalizeStr(h)); for(const c of candidates){ const i=map.indexOf(c); if(i>=0) return i; } return -1; }
function parsePt(v){ if(v==null) return NaN; const s=String(v).trim(); return /,\d{1,}$/.test(s)? Number(s.replace(/\./g,'').replace(',','.')): Number(s); }

function hav(a,b,c,d){
  const p=0.017453292519943295, cos=Math.cos;
  const x = 0.5 - cos((c - a) * p)/2 + cos(a * p) * cos(c * p) * (1 - cos((d - b) * p))/2;
  return 12742000 * Math.asin(Math.sqrt(x));
}

function nearestN(lat,lon,n=10){
  if(!dataset.length) return [];
  const arr = dataset.map(p => ({id:p.id, lat:p.lat, lon:p.lon, d:hav(lat,lon,p.lat,p.lon)}));
  arr.sort((a,b)=>a.d-b.d);
  return arr.slice(0, n);
}

// Inicializa Mapa de Satélite Panorama Geral com Esri World Imagery (Satélite Leve)
function initPanoramaMap() {
  if (panoramaMap) return;
  panoramaMap = L.map('panoramaMap', { zoomControl: false, attributionControl: false }).setView([0, 0], 2);
  
  // Camada de Satélite leve
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19
  }).addTo(panoramaMap);

  markersLayer = L.layerGroup().addTo(panoramaMap);
}

function updatePanoramaMap(items) {
  if (!panoramaMap || !lastPos) return;
  markersLayer.clearLayers();

  // Posição Atual do Usuário (Círculo Amarelo)
  userMarker = L.circleMarker([lastPos.lat, lastPos.lon], {
    color: '#ffffff',
    fillColor: '#ffd600',
    fillOpacity: 1,
    radius: 7
  }).addTo(markersLayer).bindPopup("sua posição");

  const bounds = [ [lastPos.lat, lastPos.lon] ];

  // Adiciona Marcadores de Todos os Pontos Selecionados
  items.forEach((item, idx) => {
    bounds.push([item.lat, item.lon]);
    
    const isNearest = idx === 0;
    const marker = L.circleMarker([item.lat, item.lon], {
      color: isNearest ? '#ffd600' : '#ff1744',
      fillColor: isNearest ? '#ffd600' : '#ff1744',
      fillOpacity: 0.8,
      radius: isNearest ? 7 : 5
    }).addTo(markersLayer);

    marker.bindPopup(`<b>${item.id}</b><br>dist: ${Math.round(item.d)}m`);
  });

  // Ajusta visão para enquadrar todos os pontos + posição atual
  panoramaMap.fitBounds(bounds, { padding: [20, 20] });
}

function render(){
  if(!lastPos || !dataset.length) return;
  const qty = Number(qtySel.value || 10);
  const items = nearestN(lastPos.lat, lastPos.lon, qty);

  updatePanoramaMap(items);

  listEl.innerHTML = '';
  items.forEach((o, idx) => {
    const li = document.createElement('li');
    if(idx === 0) li.classList.add('nearest');

    li.innerHTML = `
      <div class="item-header">
        <span class="id-val">${o.id}</span>
        <span class="dist-val">${Math.round(o.d)}m</span>
      </div>
      <div class="click-hint">clique para carregar satélite ➔</div>
      <div class="mini-map-box" id="map-box-${idx}"></div>
    `;

    // Clique abre o mini mapa individual sob demanda
    li.addEventListener('click', () => {
      const box = document.getElementById(`map-box-${idx}`);
      const isOpen = box.classList.contains('open');
      
      // Se já estava aberto, fecha. Se fechado, insere o iframe
      if (isOpen) {
        box.classList.remove('open');
        box.innerHTML = '';
      } else {
        box.classList.add('open');
        box.innerHTML = `<iframe src="https://maps.google.com/maps?q=${o.lat},${o.lon}&t=k&z=19&ie=UTF8&iwloc=&output=embed" loading="lazy"></iframe>`;
      }
    });

    listEl.appendChild(li);
  });

  btnSend.disabled = false;
}

async function loadCSV(){
  try{
    let resp = await fetch('dados.csv?v='+Date.now(), {cache:'no-store'}).catch(()=>null);
    if(!resp || !resp.ok) resp = await fetch('Dados_Completos_Grupo_2_all.csv?v='+Date.now(), {cache:'no-store'});
    if(!resp.ok) return;
    
    let text = await resp.text(); if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
    const lines = text.split(/\r?\n/).filter(l=>l.trim()!=='');
    const head = lines.shift().split(';');
    const iId=findColumnIndex(head,['id do nox','idnox','id']), iLat=findColumnIndex(head,['latitude','lat']), iLon=findColumnIndex(head,['longitude','lon','long']);
    
    dataset = lines.map(l=>{ const r=l.split(';'); return {id:String(r[iId]||'').trim(), lat:parsePt(r[iLat]), lon:parsePt(r[iLon])}; })
                   .filter(p=>p.id && Number.isFinite(p.lat)&&Number.isFinite(p.lon));
    render();
  }catch(e){}
}

function startGPS(){
  if(!('geolocation' in navigator)) return;
  navigator.geolocation.watchPosition(p => {
    lastPos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
    gpsStatus.className = 'status-box ok';
    gpsStatus.textContent = `gps ok (±${Math.round(p.coords.accuracy)}m)`;
    render();
  }, null, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
}

qtySel.addEventListener('change', render);

(function boot(){
  initPanoramaMap();
  loadCSV();
  startGPS();
})();
</script>
</body>
</html>
