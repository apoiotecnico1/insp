<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>SISTEMA GPS · CAMPO</title>
<meta name="theme-color" content="#000000" />
<style>
  :root {
    --bg: #000000;
    --card-bg: #111111;
    --card-border: #333333;
    --yellow: #FFD600;
    --green: #00E676;
    --highway-green: #00875A;
    --text: #FFFFFF;
    --text-dark: #000000;
    --text-muted: #999999;
    --status-ok: #00E676;
    --status-warn: #FF9100;
    --status-bad: #FF1744;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.2;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 24px;
  }

  header {
    background: #0A0A0A;
    border-bottom: 2px solid #222222;
    padding: 12px 16px;
  }

  .brand {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand h1 {
    margin: 0;
    font-weight: 900;
    letter-spacing: 0.05em;
    color: var(--yellow);
    font-size: clamp(1.1rem, 2vw, 1.3rem);
    text-transform: uppercase;
  }

  /* Placa de KM */
  .km-sign {
    display: inline-flex;
    align-items: center;
    background: var(--highway-green);
    color: #FFFFFF;
    border: 3px solid #FFFFFF;
    border-radius: 6px;
    padding: 4px 12px;
  }

  .km-label {
    font-weight: 900;
    font-size: 0.9rem;
    margin-right: 8px;
  }

  .km-value {
    font-weight: 900;
    font-size: clamp(1.4rem, 3.5vw, 2.2rem);
    line-height: 1;
  }

  /* Status do GPS */
  #status {
    max-width: 1100px;
    margin: 12px auto 0;
    padding: 0 16px;
  }

  .chip {
    display: inline-block;
    background: #1A1A1A;
    border: 2px solid #333333;
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    font-weight: 800;
    font-size: 0.95rem;
    text-transform: uppercase;
  }

  .ok { border-color: var(--status-ok); color: var(--status-ok); }
  .warn { border-color: var(--status-warn); color: var(--status-warn); }
  .bad { border-color: var(--status-bad); color: var(--status-bad); }

  main {
    max-width: 1100px;
    margin: 14px auto 0;
    display: grid;
    gap: 16px;
    padding: 0 16px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 16px;
  }

  .card {
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 10px;
    padding: 16px;
  }

  .card h2 {
    margin: 0 0 12px 0;
    font-size: 0.85rem;
    font-weight: 900;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* Botão Enviar */
  button#btnSend {
    width: 100%;
    min-height: 54px;
    padding: 14px;
    font-family: var(--font);
    font-size: 1.1rem;
    font-weight: 900;
    border: 0;
    border-radius: 8px;
    background: var(--green);
    color: var(--text-dark);
    cursor: pointer;
    text-transform: uppercase;
  }

  button#btnSend:disabled {
    background: #222222;
    color: #555555;
  }

  .opt-group {
    display: flex;
    gap: 16px;
    margin-top: 14px;
    align-items: center;
    flex-wrap: wrap;
  }

  .opt {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 800;
  }

  .opt select {
    padding: 10px 14px;
    font-family: var(--font);
    font-size: 1rem;
    font-weight: 900;
    border-radius: 8px;
    border: 2px solid #444444;
    background: #222222;
    color: #FFFFFF;
  }

  .opt input[type="checkbox"] {
    width: 22px;
    height: 22px;
    accent-color: var(--yellow);
  }

  /* Lista de IDs */
  ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 10px;
  }

  li {
    border: 2px solid var(--card-border);
    border-radius: 8px;
    padding: 14px 16px;
    background: #181818;
    font-weight: 800;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* ID Mais Próximo */
  li.nearest {
    background: var(--yellow);
    border: 3px solid #FFFFFF;
    color: var(--text-dark);
  }

  li.nearest .id-label {
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--text-dark);
  }

  li.nearest .dist {
    font-size: 1.2rem;
    font-weight: 900;
    color: var(--text-dark);
    background: #FFFFFF;
    padding: 4px 10px;
    border-radius: 6px;
  }

  .id-label {
    font-size: 1.2rem;
    font-weight: 800;
  }

  .dist {
    color: var(--yellow);
    font-size: 1rem;
    font-weight: 800;
  }

  .skeleton {
    height: 58px;
    background: #222222;
    border-radius: 8px;
  }

  .col-4 { grid-column: span 4; }
  .col-8 { grid-column: span 8; }
  @media (max-width: 900px) { .col-4, .col-8 { grid-column: 1 / -1; } }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>LOCALIZAÇÃO DE CAMPO</h1>
    <div id="kmChip" class="km-sign" aria-live="polite">
      <span class="km-label">KM</span>
      <span id="kmValue" class="km-value">—</span>
    </div>
  </div>
</header>

<div id="status">
  <div id="gpsChip" class="chip bad" aria-live="polite">
    <span id="gpsText">BUSCANDO GPS...</span>
  </div>
</div>

<main>
  <div class="grid">
    <section class="card col-4">
      <h2>AÇÕES DE TRANSMISSÃO</h2>
      <button id="btnSend" disabled>ENVIAR VIA WHATSAPP</button>
      
      <div class="opt-group">
        <label class="opt">
          <span>REGISTROS:</span>
          <select id="qty">
            <option value="1">1</option>
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
          </select>
        </label>
        <label class="opt">
          <input type="checkbox" id="chkMaps" />
          <span>INCLUIR MAPS</span>
        </label>
      </div>
    </section>

    <section class="card col-8">
      <h2>REGISTROS PRÓXIMOS</h2>
      <ul id="list" aria-live="polite">
        <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
      </ul>
    </section>
  </div>
</main>

<script>
const ACC_GREEN=15, ACC_YELLOW=35;
let dataset=[], kmDataset=[], lastPos=null, isRendering=false;

class KalmanFilter {
  constructor(R = 0.00001, Q = 0.000001) {
    this.R = R; this.Q = Q; this.x = NaN; this.cov = NaN;
  }
  filter(z) {
    if (isNaN(this.x)) { this.x = z; this.cov = 1; return z; }
    const predCov = this.cov + this.Q;
    const K = predCov / (predCov + this.R);
    this.x = this.x + K * (z - this.x);
    this.cov = predCov * (1 - K);
    return this.x;
  }
}
const kLat = new KalmanFilter(), kLon = new KalmanFilter();

const gpsChip=document.getElementById('gpsChip'), gpsText=document.getElementById('gpsText');
const btnSend=document.getElementById('btnSend'), chkMaps=document.getElementById('chkMaps'), qtySel=document.getElementById('qty');
const listEl=document.getElementById('list'), kmValue=document.getElementById('kmValue');

function normalizeStr(s){ return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9_ ]+/g,' ').replace(/\s+/g,' '); }
function findColumnIndex(headers, candidates){ const map=headers.map(h=>normalizeStr(h)); for(const c of candidates){ const i=map.indexOf(c); if(i>=0) return i; } return -1; }
function parsePt(v){ if(v==null) return NaN; const s=String(v).trim(); return /,\d{1,}$/.test(s)? Number(s.replace(/\./g,'').replace(',','.')): Number(s); }

function hav(a,b,c,d){
  const p=0.017453292519943295, cos=Math.cos;
  const x = 0.5 - cos((c - a) * p)/2 + cos(a * p) * cos(c * p) * (1 - cos((d - b) * p))/2;
  return 12742000 * Math.asin(Math.sqrt(x));
}

function nearestN(lat,lon,n=10){
  if(!dataset.length) return [];
  const margin = 0.05;
  const filtered = dataset.filter(p => Math.abs(p.lat - lat) < margin && Math.abs(p.lon - lon) < margin);
  const targetArray = filtered.length >= n ? filtered : dataset;
  
  const arr = targetArray.map(p => ({id:p.id, lat:p.lat, lon:p.lon, d:hav(lat,lon,p.lat,p.lon)}));
  arr.sort((a,b)=>a.d-b.d);
  return arr.slice(0, n);
}

function fmtAcc(a){ return (a==null||!Number.isFinite(a))?'—':('±'+Math.round(a)+'M'); }
function nowBR(){ return new Date().toLocaleString('pt-BR'); }

function updateGpsChip(){
  if(!lastPos || lastPos.acc==null){ gpsChip.className='chip bad'; gpsText.textContent='GPS: BUSCANDO...'; return; }
  const a=Math.round(lastPos.acc);
  if(a<=ACC_GREEN){ gpsChip.className='chip ok'; gpsText.textContent=`GPS OK (${fmtAcc(a)})`; }
  else if(a<=ACC_YELLOW){ gpsChip.className='chip warn'; gpsText.textContent=`GPS MÉDIO (${fmtAcc(a)})`; }
  else { gpsChip.className='chip bad'; gpsText.textContent=`GPS FRACO (${fmtAcc(a)})`; }
}

async function loadCSV(){
  try{
    let resp = await fetch('dados.csv?v='+Date.now(), {cache:'no-store'}).catch(()=>null);
    if(!resp || !resp.ok) resp = await fetch('Dados_Completos_Grupo_2_all.csv?v='+Date.now(), {cache:'no-store'});
    if(!resp.ok) return;
    
    let text = await resp.text(); if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
    const lines = text.split(/\r?\n/).filter(l=>l.trim()!=='');
    const head = lines.shift().split(';');
    const iId=findColumnIndex(head,['id do nox','idnox','id']), iLat=findColumnIndex(head,['latitude','lat']), iLon=findColumnIndex(head,['longitude','lon','long']);
    
    dataset = lines.map(l=>{ const r=l.split(';'); return {id:String(r[iId]||'').trim(), lat:parsePt(r[iLat]), lon:parsePt(r[iLon])}; })
                   .filter(p=>p.id && Number.isFinite(p.lat)&&Number.isFinite(p.lon));
                   
    dataset.sort((a,b) => a.lat - b.lat);
    render();
  }catch(e){}
}

function render(){
  if(isRendering) return;
  isRendering = true;
  requestAnimationFrame(()=>{
    listEl.innerHTML='';
    if(lastPos && dataset.length){
      const qty = Number(qtySel.value || 10);
      const items = nearestN(lastPos.lat, lastPos.lon, qty);
      const frag = document.createDocumentFragment();
      
      items.forEach((o,idx)=>{
        const li = document.createElement('li');
        if(idx===0){
          li.classList.add('nearest');
          li.innerHTML = `<span class="id-label">${o.id}</span><span class="dist">${Math.round(o.d)} M</span>`;
        } else {
          li.innerHTML = `<span class="id-label">${o.id}</span><span class="dist">${Math.round(o.d)} M</span>`;
        }
        frag.appendChild(li);
      });
      listEl.appendChild(frag);
    }
    btnSend.disabled = !(dataset.length > 0 && lastPos);
    isRendering = false;
  });
}

function startGPS(){
  if(!('geolocation' in navigator)) return;
  navigator.geolocation.watchPosition(p=>{
    const filteredLat = kLat.filter(p.coords.latitude);
    const filteredLon = kLon.filter(p.coords.longitude);
    
    lastPos = { lat: filteredLat, lon: filteredLon, acc: p.coords.accuracy };
    updateGpsChip();
    render();
    updateKMChip();
  }, err=>{}, {enableHighAccuracy:true, maximumAge:0, timeout:10000});
}

btnSend.addEventListener('click', ()=>{
  if(!lastPos) return;
  const items = nearestN(lastPos.lat, lastPos.lon, Number(qtySel.value || 10));
  let tx = `[TELEMETRIA DE CAMPO] ${nowBR()}\nGPS: ${lastPos.lat.toFixed(6)},${lastPos.lon.toFixed(6)} (${fmtAcc(lastPos.acc)})\n\n`;
  items.forEach(o => tx += `ID: ${o.id}\n`);
  if(chkMaps.checked){
    tx += '\nMAPAS:\n';
    items.forEach(o => tx += `ID ${o.id}: https://maps.google.com/?q=${o.lat.toFixed(6)},${o.lon.toFixed(6)}\n`);
  }
  window.open('https://wa.me/?text='+encodeURIComponent(tx),'_blank');
});

qtySel.addEventListener('change', render);

async function loadKMCSV(){
  try{
    let resp = await fetch('SNVBR116SPRJ.csv?v=' + Date.now(), {cache:'no-store'});
    if(!resp.ok) return;
    let text = await resp.text(); if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
    const head = lines.shift().split(';');
    const iKm = findColumnIndex(head, ['km']), iLat = findColumnIndex(head, ['lat','latitude']), iLon = findColumnIndex(head, ['lon','long','longitude']);
    kmDataset = lines.map(l=>{ const r = l.split(';'); return { km:parsePt(r[iKm]), lat:parsePt(r[iLat]), lon:parsePt(r[iLon]) }; })
                     .filter(p => Number.isFinite(p.km) && Number.isFinite(p.lat) && Number.isFinite(p.lon));
  }catch(e){}
}

function updateKMChip(){
  if(!lastPos || !kmDataset.length) return;
  let best = null, bd = Infinity;
  for(let i=0; i<kmDataset.length; i++){
    const p = kmDataset[i];
    const d = hav(lastPos.lat, lastPos.lon, p.lat, p.lon);
    if(d < bd){ bd = d; best = p; }
  }
  if(best) kmValue.textContent = (Math.round(best.km * 100) / 100).toFixed(2).replace('.', ',');
}

(function boot(){
  loadCSV();
  loadKMCSV();
  startGPS();
})();
</script>
</body>
</html>
